.card{border:1px solid var(--line);background:linear-gradient(145deg,rgba(20,18,16,.94),rgba(8,8,7,.96));padding:15px;position:relative}.card.red{border-color:rgba(143,31,36,.45);box-shadow:inset 0 0 30px rgba(143,31,36,.05)}.card+.card{margin-top:10px}.button{width:100%;min-height:52px;border:1px solid rgba(214,206,186,.26);background:linear-gradient(135deg,#171410,#0b0a09);color:#e7dfd0;padding:12px 14px;cursor:pointer;text-align:left;transition:.16s}.button:hover,.button:active{border-color:var(--linehot);background:linear-gradient(135deg,rgba(86,18,22,.42),#0b0a09)}.button.primary{border-color:#8e292d;background:linear-gradient(135deg,#551317,#170b0b);text-align:center;font:700 .66rem/1.1 Arial,sans-serif;letter-spacing:.15em;text-transform:uppercase}.button.secondary{text-align:center;font:700 .61rem/1.1 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#aaa18f}.button:disabled{opacity:.38;cursor:not-allowed}.button b{display:block;font:700 .64rem/1.2 Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase}.button span{display:block;margin-top:5px;color:#aaa293;font-size:.86rem;line-height:1.35}.grid{display:grid;gap:10px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.field{display:grid;gap:6px;margin:11px 0}.field label{font:700 .56rem/1 Arial,sans-serif;letter-spacing:.13em;text-transform:uppercase;color:#9f9687}.field input,.field select{width:100%;background:#090908;color:#e7dfd1;border:1px solid rgba(214,206,186,.25);padding:12px;border-radius:0}.field input:focus,.field select:focus{outline:1px solid var(--red)}

.scene-media{position:relative;margin:8px 0 18px;max-width:430px}.scene-media.right{float:right;margin:4px 0 14px 20px}.scene-media.left{float:left;margin:4px 20px 14px 0}.scene-media img.art{width:100%;max-height:540px;object-fit:cover;filter:saturate(.85) contrast(1.07) brightness(.84)}.scene-media:after{content:"";position:absolute;inset:-10px;pointer-events:none;background:url('/media/ui/frames/kult_ornate_frame_alt_bone.png') center/100% 100% no-repeat;opacity:.75}.scene-media.dossier:after{display:none}.scene-media.dossier{border:1px solid rgba(214,206,186,.38);background:#bdb39d;padding:7px;box-shadow:0 12px 32px rgba(0,0,0,.4)}.scene-media.dossier img.art{filter:contrast(1.02);max-height:none}.story-clear:after{content:"";display:block;clear:both}

.roam-header{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:12px}.time-slots{display:flex;gap:5px}.slot{width:10px;height:10px;border:1px solid #8e8678;border-radius:50%}.slot.used{background:var(--red);border-color:var(--red)}.location-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.location{min-height:135px}.location h3{margin:0 0 6px;font-size:1.04rem;font-weight:400;color:#ded4c2}.location .action-list{display:grid;gap:6px;margin-top:10px}.location .button{min-height:44px;padding:9px 10px}.location .button b{font-size:.55rem}.result-card{margin:14px 0;border-left:2px solid var(--red);padding:12px 13px;background:rgba(89,23,28,.12)}.result-card h3{margin:0 0 6px;font-weight:400}.roll-inline{margin-top:8px;font:700 .59rem/1.5 Arial,sans-serif;text-transform:uppercase;letter-spacing:.09em;color:#b9ae9b}.roll-inline.complete{color:#8eb493}.roll-inline.complication{color:#c5a66b}.roll-inline.failure{color:#c16c6c}
.journal-tabs{display:flex;gap:6px;margin-bottom:12px}.tab{flex:1;border:1px solid var(--line);background:#0a0908;color:#978f82;padding:10px;font:700 .55rem/1 Arial,sans-serif;text-transform:uppercase;letter-spacing:.12em}.tab.active{color:#e1d7c5;border-color:var(--linehot);background:rgba(83,13,18,.18)}.evidence{padding:12px 0;border-bottom:1px solid var(--line)}.evidence:last-child{border:0}.evidence b{display:block;font-size:1rem;font-weight:400;color:#e1d8ca}.evidence p{margin:5px 0 0;color:#9d9587;line-height:1.45;font-size:.9rem}.evidence .button{width:auto;min-height:36px;padding:7px 9px;margin-top:8px;font-size:.78rem}

.bottom-nav{position:fixed;z-index:45;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom);background:rgba(5,5,5,.96);border-top:1px solid var(--line)}.nav{height:var(--nav);width:min(100%,var(--max));margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.nav button{border:0;border-right:1px solid rgba(214,206,186,.08);background:transparent;color:#8c8478;font:700 .52rem/1 Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase}.nav button:last-child{border-right:0}.nav button.active{color:#d8cebb;background:rgba(86,18,22,.16)}
.overlay{position:fixed;inset:0;z-index:100;background:rgba(2,2,2,.92);backdrop-filter:blur(15px);display:none;align-items:center;justify-content:center;padding:20px}.overlay.open{display:flex}.resolve-inner{text-align:center;width:min(100%,520px)}.resolve-symbol{width:190px;max-width:48vw;margin:auto;animation:pulse 2.3s ease-in-out infinite;filter:drop-shadow(0 0 26px rgba(143,31,36,.26))}@keyframes pulse{0%,100%{opacity:.62;transform:scale(.985)}50%{opacity:1;transform:scale(1.015)}}.resolve-title{font:700 .66rem/1 Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#b44b4e;margin-top:18px}.resolve-line{margin:13px auto 0;max-width:430px;font-size:1.1rem;line-height:1.55;color:#cfc6b6;font-style:italic}.resolve-fracture{height:80px;margin-top:15px;background:url('/media/ui/motifs/resolution_fracture_01_red.png') center/contain no-repeat;opacity:.35}.modal{width:min(100%,560px);border:1px solid rgba(214,206,186,.24);background:linear-gradient(150deg,#14120f,#080807);padding:20px;box-shadow:0 24px 70px rgba(0,0,0,.6)}.modal-symbol{width:90px;margin:0 auto 12px}.modal h2{margin:0 0 10px;text-align:center;font-weight:400;text-transform:uppercase;letter-spacing:.08em}.modal p{color:#a59c8d;line-height:1.55}.modal-actions{display:grid;gap:8px;margin-top:16px}.toast{position:fixed;z-index:120;left:50%;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);width:min(calc(100% - 24px),520px);padding:11px 13px;background:#161310;border:1px solid var(--linehot);box-shadow:0 12px 35px rgba(0,0,0,.55);display:none}.toast.show{display:block}.toast b{font:700 .55rem/1 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#c65c60}.toast span{display:block;margin-top:4px;color:#d5ccbc;font-size:.9rem}
.read-toggle{display:flex;align-items:center;gap:8px}.read-toggle label{font:700 .5rem/1 Arial,sans-serif;text-transform:uppercase;letter-spacing:.1em;color:#81796c}.switch{width:50px;height:26px;border:1px solid var(--line);position:relative;background:#090908;cursor:pointer}.switch i{position:absolute;top:3px;left:3px;width:18px;height:18px;background:#6f675b;transition:.18s}.switch.on{border-color:#8d3033;background:rgba(84,18,22,.35)}.switch.on i{left:27px;background:#b7494c}
@media(max-width:680px){.main{padding-left:12px;padding-right:12px}.hero{margin-left:-12px;margin-right:-12px}.location-grid,.grid.two{grid-template-columns:1fr}.attr-grid{grid-template-columns:1fr}.scene-media.right,.scene-media.left{float:none;margin:8px auto 18px;max-width:100%}.presence{min-width:0;padding:7px 8px}.presence-text b{max-width:86px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand{font-size:1rem}.nav button{font-size:.47rem}.title{font-size:2.2rem}.ready-grid{grid-template-columns:1fr 1fr}}

<body>
<div class="app">
  <header class="topbar hidden" id="topbar">
    <div><div class="brand-kicker">KULT: Divinity Lost</div><div class="brand">CHAGIDIEL</div></div>
    <div style="display:flex;align-items:center;gap:9px">
      <div class="read-toggle"><label>Read Aloud</label><div class="switch" id="readSwitch" role="switch" aria-checked="false"><i></i></div></div>
      <div class="presence" id="presence"><i class="presence-dot"></i><div class="presence-text"><b>Other protagonist</b><span>Offline</span></div></div>
    </div>
  </header>
  <main class="main" id="main"></main>
</div>
<nav class="bottom-nav hidden" id="bottomNav"><div class="nav">
  <button data-nav="story" class="active">Story</button><button data-nav="case">Case File</button><button data-nav="relations">Relations</button><button data-nav="character">Character</button><button data-nav="settings">Settings</button>
</div></nav>
<div class="overlay" id="resolveOverlay"><div class="resolve-inner"><img class="resolve-symbol" src="/media/ui/motifs/kult_winged_emblem_red.png"><div class="resolve-title" id="resolveTitle">Resolving</div><div class="resolve-line" id="resolveLine">The world considers your choice.</div><div class="resolve-fracture"></div></div></div>
<div class="overlay" id="modalOverlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"><b></b><span></span></div>
<audio id="narration" preload="none"></audio>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const API={token:localStorage.getItem('chagidielToken')||'',campaign:localStorage.getItem('chagidielCampaign')||'',state:null,ws:null,preview:false};
const MOVE_LABEL={act_under_pressure:'Act Under Pressure +Reflexes',endure_injury:'Endure Injury +Fortitude',keep_it_together:'Keep It Together +Willpower',engage_in_combat:'Engage in Combat +Violence',employ_stealth:'Employ Stealth +Coolness',influence_other:'Influence Other +Charisma',observe_situation:'Observe a Situation +Perception',read_person:'Read a Person +Intuition',see_through_illusion:'See Through the Illusion +Soul',investigate:'Investigate +Reason',improvised:'Improvised Move'};
const tensionLines=['The world considers your choice.','Nothing moves. That does not mean nothing has changed.','Some answers arrive only after the question becomes dangerous.','You have committed to the moment. Now it commits to you.','The pause is brief. It does not feel brief.'];
let nav='story', journalTab='shared', lastPresence=false, readBusy=false, audioUnlocked=false, lastNarratedKey='';
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(title,text){const t=$('#toast');t.querySelector('b').textContent=title;t.querySelector('span').textContent=text;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3200)}
function showResolve(title='Resolving',line=null){$('#resolveTitle').textContent=title;$('#resolveLine').textContent=line||tensionLines[Math.floor(Math.random()*tensionLines.length)];$('#resolveOverlay').classList.add('open')}
function hideResolve(){ $('#resolveOverlay').classList.remove('open') }
function showModal(html){$('#modal').innerHTML=html;$('#modalOverlay').classList.add('open')}
function hideModal(){ $('#modalOverlay').classList.remove('open') }
async function request(path,opts={}){const headers=new Headers(opts.headers||{});if(API.token)headers.set('authorization','Bearer '+API.token);if(opts.body&&!headers.has('content-type'))headers.set('content-type','application/json');const r=await fetch(path,{...opts,headers});const ct=r.headers.get('content-type')||'';const data=ct.includes('json')?await r.json():await r.text();if(!r.ok){const base=data?.error||data?.warning||String(data);const detail=data?.detail&&data.detail!==base?' — '+data.detail:'';throw new Error(base+detail)}return data}
function route(){if(!API.token)return renderLogin();if(!API.campaign)return renderHub();if(!API.state)return renderLoading();renderApp()}
function shell(show=true){$('#topbar').classList.toggle('hidden',!show);$('#bottomNav').classList.toggle('hidden',!show)}
function renderLoading(){shell(true);$('#main').innerHTML='<div class="screen"><div class="kicker">Connecting</div><h1 class="title">Chagidiel</h1><div class="copy"><p>Recovering the campaign state...</p></div></div>'}
function renderLogin(){shell(false);$('#main').innerHTML=`<div class="screen"><div class="hero"><img src="/media/art/lore/campaign_cover_black_madonna.webp"><div class="hero-brand"><img class="hero-symbol" src="/media/ui/motifs/kult_winged_emblem_red.png"><h1>Chagidiel</h1><p>A two-protagonist Black Madonna campaign</p></div></div><div class="card red"><div class="kicker">Player Identity</div><h2 style="margin:0 0 8px;font-weight:400">Continue with a verified address</h2><div class="field"><label>Login method</label><select id="loginMethod"><option value="email">Email</option><option value="sms">Text message</option></select></div><div class="field"><label id="loginValueLabel">Email address</label><input id="loginValue" autocomplete="email" placeholder="you@example.com"></div><button class="button primary" id="sendCode">Send one-time code</button><div class="small muted" style="margin-top:10px">No password. Your verified address becomes your permanent player identity; the other player never sees it.</div></div></div>`;const sync=()=>{const sms=$('#loginMethod').value==='sms',i=$('#loginValue');$('#loginValueLabel').textContent=sms?'Mobile number':'Email address';i.placeholder=sms?'(713) 555-0123 or +44…':'you@example.com';i.autocomplete=sms?'tel':'email';i.inputMode=sms?'tel':'email'};$('#loginMethod').onchange=sync;sync();$('#sendCode').onclick=sendCode}
async function sendCode(){const method=$('#loginMethod').value,value=$('#loginValue').value.trim();if(!value)return;showResolve('Sending code','A small proof before the larger mistakes.');try{const d=await request('/api/auth/request',{method:'POST',body:JSON.stringify({method,value})});hideResolve();const via=d.provider==='twilio_verify'?' by Twilio Verify':d.provider==='resend'?' by email':d.provider==='twilio_messages'?' by text message':'';showModal(`<img class="modal-symbol" src="/media/ui/motifs/kult_winged_emblem_bone.png"><h2>Enter your code</h2><p>${d.sent?`A verification code has been sent${via}.`:'Provider delivery is unavailable.'}${d.devCode?` Development code: <strong>${esc(d.devCode)}</strong>`:''}${d.warning?`<br><span class="small muted">${esc(d.warning)}</span>`:''}</p><div class="field"><label>Verification code</label><input id="otp" inputmode="numeric" maxlength="10" autocomplete="one-time-code" placeholder="000000"></div><div class="modal-actions"><button class="button primary" id="verifyCode">Verify</button><button class="button secondary" id="cancelModal">Cancel</button></div>`);$('#cancelModal').onclick=hideModal;$('#verifyCode').onclick=()=>verifyCode(method,value)}catch(e){hideResolve();toast('Login',e.message)}}
async function verifyCode(method,value){try{const d=await request('/api/auth/verify',{method:'POST',body:JSON.stringify({method,value,code:$('#otp').value})});API.token=d.token;localStorage.setItem('chagidielToken',d.token);hideModal();await promptNotifications();route()}catch(e){toast('Verification',e.message)}}
async function promptNotifications(){if(localStorage.getItem('chagidielNotifAsked'))return;localStorage.setItem('chagidielNotifAsked','1');showModal(`<img class="modal-symbol" src="/media/ui/motifs/kult_winged_emblem_red.png"><h2>Story notifications</h2><p>Chagidiel can alert you when the other protagonist reaches a Story Lock or your decision is required. Browser notifications are requested here; verified email/text is also available as a fallback when configured.</p><div class="modal-actions"><button class="button primary" id="enableNotif">Enable notifications</button><button class="button secondary" id="skipNotif">Not now</button></div>`);$('#skipNotif').onclick=hideModal;$('#enableNotif').onclick=async()=>{try{if('serviceWorker'in navigator)await navigator.serviceWorker.register('/sw.js');if('Notification'in window)await Notification.requestPermission();}catch(e){}hideModal()}}
function renderHub(){shell(false);$('#main').innerHTML=`<div class="screen"><div class="hero"><img src="/media/art/lore/campaign_cover_black_madonna.webp"><div class="hero-brand"><img class="hero-symbol" src="/media/ui/motifs/kult_winged_emblem_red.png"><h1>Chagidiel</h1><p>Two seats. Two protagonists. One campaign.</p></div></div><div class="grid two"><div class="card"><div class="kicker">New campaign</div><h2 style="font-weight:400">Create a table</h2><p class="muted">Create Seat A and receive a one-use invite code for the second player.</p><button class="button primary" id="createCampaign">Create campaign</button></div><div class="card"><div class="kicker">Join campaign</div><h2 style="font-weight:400">Claim Seat B</h2><div class="field"><label>Campaign ID</label><input id="joinCampaign" placeholder="c_..."></div><div class="field"><label>Invite code</label><input id="joinInvite" placeholder="XXXXXXXXXX"></div><button class="button primary" id="joinCampaignBtn">Join campaign</button></div></div></div>`;$('#createCampaign').onclick=createCampaign;$('#joinCampaignBtn').onclick=joinCampaign}
async function createCampaign(){showResolve('Creating campaign');try{const d=await request('/api/campaigns',{method:'POST'});API.campaign=d.state.id;API.state=d.state;localStorage.setItem('chagidielCampaign',API.campaign);hideResolve();connectWs();renderApp();showModal(`<img class="modal-symbol" src="/media/ui/motifs/kult_winged_emblem_bone.png"><h2>Invite the second protagonist</h2><p>Campaign ID</p><div class="card"><strong>${esc(API.campaign)}</strong></div><p>Single-use invite code</p><div class="card"><strong style="font-size:1.4rem;letter-spacing:.16em">${esc(d.invite)}</strong></div><div class="modal-actions"><button class="button primary" id="doneInvite">Continue</button></div>`);$('#doneInvite').onclick=hideModal}catch(e){hideResolve();toast('Campaign',e.message)}}
async function joinCampaign(){const campaignId=$('#joinCampaign').value.trim(),invite=$('#joinInvite').value.trim();showResolve('Joining campaign');try{const d=await request('/api/campaigns/join',{method:'POST',body:JSON.stringify({campaignId,invite})});API.campaign=campaignId;API.state=d.state;localStorage.setItem('chagidielCampaign',campaignId);hideResolve();connectWs();renderApp();promptNotifications()}catch(e){hideResolve();toast('Join campaign',e.message)}}
async function loadState(){if(!API.campaign)return;try{const d=await request(`/api/campaigns/${API.campaign}/state`);API.state=d.state;connectWs();renderApp()}catch(e){localStorage.removeItem('chagidielCampaign');API.campaign='';API.state=null;toast('Campaign',e.message);route()}}
function connectWs(){if(!API.campaign||!API.token||API.ws)return;try{const u=new URL(location.href);u.protocol=u.protocol==='https:'?'wss:':'ws:';u.pathname=`/api/campaigns/${API.campaign}/ws`;u.search='?token='+encodeURIComponent(API.token);const ws=new WebSocket(u);API.ws=ws;ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='state'){const was=!!API.state?.partner?.online;API.state=m.state;const now=!!m.state?.partner?.online;if(!was&&now&&Notification.permission==='granted'&&document.hidden)notifyLocal('Chagidiel','The other protagonist is online.');renderApp()}}catch(_){}};ws.onclose=()=>{API.ws=null;setTimeout(connectWs,1800)};ws.onerror=()=>{};}catch(e){}}
async function act(body,title='Resolving',line=null){showResolve(title,line);const start=Date.now();try{const d=await request(`/api/campaigns/${API.campaign}/action`,{method:'POST',body:JSON.stringify(body)});const wait=Math.max(0,1200-(Date.now()-start));await new Promise(r=>setTimeout(r,wait));API.state=d.state;hideResolve();renderApp();return d.state}catch(e){hideResolve();toast('Chagidiel',e.message);throw e}}
function renderApp(){shell(true);updatePresence();$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.nav===nav));if(nav!=='story')return renderPanel();const s=API.state;if(!s.player.character)return renderCharacterCreator();if(!s.partner?.character)return renderWaitingPartner();if(s.current.mode==='story_gate')return renderStoryGate();if(s.current.mode==='story_lock')return renderStoryLock();if(s.current.mode==='free_roam')return renderFreeRoam();if(s.current.mode==='epilogue'||s.betaComplete)return renderBetaComplete();renderWaitingPartner()}
function updatePresence(){const p=API.state?.partner,el=$('#presence');if(!p){el.classList.remove('online');el.querySelector('b').textContent='Second seat';el.querySelector('span').textContent='Not joined';return}el.classList.toggle('online',!!p.online);el.querySelector('b').textContent=p.character?.name||'Other protagonist';el.querySelector('span').textContent=p.online?'Online':'Offline'}
function renderCharacterCreator(){const a=['fortitude','willpower','reflexes','reason','intuition','perception','coolness','violence','charisma','soul'];$('#main').innerHTML=`<div class="screen"><div class="kicker">Seat ${esc(API.state.seat)} - Character Setup</div><h1 class="title">Your protagonist</h1><div class="copy"><p>This beta uses campaign-linked occupations and Magda relationships from <em>The Black Madonna</em>. Attribute entry is deliberately manual until the full core character-creation rules are added.</p></div><div class="card"><div class="field"><label>Name</label><input id="charName" placeholder="Character name"></div><div class="field"><label>Occupation</label><select id="occupation"><option value="journalist">Freelance Journalist</option><option value="writer">Horror Writer</option><option value="bookseller">Rare Book Dealer</option><option value="kgb">Defected KGB Operative</option><option value="agent">Literary Agent</option></select></div><div class="field"><label>Relationship with Magda</label><select id="relation"><option value="journalism">Know her through journalism</option><option value="bookstore">Know her through her antique bookstore</option><option value="friend">Friend of a friend</option><option value="helped">She helped you through a bad time</option><option value="lover">Former lover</option><option value="literary">Literary circles</option><option value="child">Child of Magda Orlova</option></select></div><div class="divider"></div><div class="kicker">Attributes - Beta Entry</div><div class="attr-grid">${a.map(x=>`<div class="attr"><label>${esc(x.replaceAll('_',' '))}</label><select data-attr="${x}">${[-2,-1,0,1,2,3].map(n=>`<option value="${n}" ${n===0?'selected':''}>${n>=0?'+':''}${n}</option>`).join('')}</select></div>`).join('')}</div><button class="button primary" id="saveCharacter" style="margin-top:16px">Lock character for beta</button></div></div>`;$('#saveCharacter').onclick=()=>{const attrs={};$$('[data-attr]').forEach(s=>attrs[s.dataset.attr]=Number(s.value));act({type:'set_character',character:{name:$('#charName').value||'Unnamed',occupation:$('#occupation').value,relation:$('#relation').value,attributes:attrs}},'Saving protagonist','A name is a small thing to give the dark.')}}
function renderWaitingPartner(){const s=API.state;$('#main').innerHTML=`<div class="screen"><div class="kicker">Campaign ${esc(s.id)}</div><h1 class="title">Waiting for the other seat</h1><div class="copy"><p>Your protagonist is ready. The campaign begins only when both players have claimed a seat and created a character.</p></div><div class="card"><b>Seat ${esc(s.seat)}</b><p>${esc(s.player.character?.name||'Character ready')}</p></div><div class="card"><b>Other protagonist</b><p>${s.partner?(s.partner.character?esc(s.partner.character.name):'Joined - creating character'):'Not joined yet'}</p></div></div>`}
function renderStoryGate(){const s=API.state,g=s.storyLock.gate,forced=!!g?.forced,seat=s.seat;const myReady=forced?g?.acknowledged?.[seat]:s.storyLock.ready?.[seat],other=seat==='A'?'B':'A',otherReady=forced?g?.acknowledged?.[other]:s.storyLock.ready?.[other];const name=s.current.scene==='gold_plaque'?'The Gold Plaque':s.current.scene==='ambush'?'An Event Interrupts Free Roam':"Pogodin's Mansion";$('#main').innerHTML=`<div class="screen"><div class="lock-banner"><img src="/media/ui/motifs/kult_winged_emblem_red.png"><div><b>${forced?'Forced Story Lock':'Story Convergence Ahead'}</b><span>Both protagonists are required until this scenario ends.</span></div></div><div class="kicker">${forced?'Free Roam interrupted':'Point of no return'}</div><h1 class="title">${esc(name)}</h1><div class="copy"><p>${forced?'An event has already caught up with you. The prompt is informational: once both players acknowledge it, shared progression begins.':'Entering this scene closes Free Roam. Neither protagonist can enter a solo or parallel state until the Story Lock scenario is completely resolved.'}</p><p>Finish any remaining review of the case file before you commit.</p></div><div class="ready-grid"><div class="ready ${myReady?'yes':''}">You<br>${myReady?'Ready':'Not ready'}</div><div class="ready ${otherReady?'yes':''}">Partner<br>${otherReady?'Ready':'Waiting'}</div></div>${myReady?`<button class="button secondary" id="cancelReady" ${forced?'disabled':''}>${forced?'Acknowledged - waiting':'Cancel readiness'}</button>`:`<button class="button primary" id="readyLock">${forced?'Acknowledge and continue':'Enter Story Lock'}</button>`}</div>`;if($('#readyLock'))$('#readyLock').onclick=()=>act({type:'story_gate_ready'},forced?'Acknowledging Story Lock':'Entering Story Lock',forced?'The interruption has already begun.':'There are moments when separate roads cease to be separate.');if($('#cancelReady')&&!forced)$('#cancelReady').onclick=()=>act({type:'story_gate_cancel'},'Stepping back','The threshold remains open. Nothing has crossed it yet.')}
function rollText(r){if(!r)return'';return `${esc(r.move)} - ${r.dice[0]} + ${r.dice[1]} ${r.modifier>=0?'+':'-'} ${Math.abs(r.modifier)} = ${r.total} - ${r.outcome==='complete'?'Complete Success':r.outcome==='complication'?'Success with Complications':'Failure'}`}
function renderStoryLock(){const s=API.state,st=s.story,last=s.storyLock.lastResolution;const img=st.art?`<figure class="scene-media ${s.current.scene==='pogodin'?'right':'left'}"><img class="art" src="${st.art}" alt=""></figure>`:'';$('#main').innerHTML=`<div class="screen"><div class="lock-banner"><img src="/media/ui/motifs/kult_winged_emblem_red.png"><div><b>Story Lock Active</b><span>No solo progression until this scenario ends.</span></div></div><div class="kicker">${esc(st.kicker)}</div><h1 class="title">${esc(st.title)}</h1><div class="copy story-clear">${img}${st.text.map(p=>`<p>${esc(p)}</p>`).join('')}${last?`<div class="result-card"><h3>Previous beat</h3>${last.text.map(p=>`<p>${esc(p)}</p>`).join('')}<div class="small muted">${['A','B'].map(x=>last.actions?.[x]?.roll?`${x}: ${rollText(last.actions[x].roll)}`:'').filter(Boolean).join('<br>')}</div></div>`:''}</div>${s.storyLock.submitted?`<div class="card red"><div class="kicker">Action locked</div><p class="muted">Waiting for the other protagonist. Your selection remains sealed until both are in.</p></div>`:`<div class="choices">${(s.choices||[]).map((c,i)=>`<button class="button choice" data-action="${esc(c.id)}" data-n="${['I','II','III','IV','V','VI'][i]||i+1}"><b>${esc(c.label)}</b>${c.move?`<span class="move">${esc(MOVE_LABEL[c.move]||c.move)}</span>`:''}</button>`).join('')}</div>`}</div>`;$$('[data-action]').forEach(b=>b.onclick=()=>act({type:'lock_action',actionId:b.dataset.action},'Resolving action',tensionLines[Math.floor(Math.random()*tensionLines.length)]));scheduleReadAloud()}
function renderFreeRoam(){const s=API.state,fr=s.freeRoam,last=fr.lastResult;$('#main').innerHTML=`<div class="screen"><div class="roam-header"><div><div class="kicker">Free Roam - ${esc(fr.day)}</div><h1 class="title" style="font-size:2.35rem;margin-bottom:3px">Berlin</h1></div><div><div class="small muted" style="text-align:right;margin-bottom:5px">Your time</div><div class="time-slots">${fr.slots.map(x=>`<i class="slot ${x?'used':''}"></i>`).join('')}</div></div></div><div class="copy"><p>You may investigate independently. The other protagonist's time is their own. Discoveries enter your private notes first; sharing them makes them character knowledge for both protagonists.</p></div>${last&&last.kind!=='roll'?`<div class="result-card"><h3>${esc(last.locationName)}</h3><p>${esc(last.prose)}</p>${last.roll?`<div class="roll-inline ${last.roll.outcome}">${rollText(last.roll)}</div>`:''}<div style="margin-top:8px"><button class="button secondary" id="shareLatest">Add discovery to shared case file</button></div></div>`:''}<div class="location-grid">${Object.entries(fr.locations).map(([id,l])=>`<div class="card location"><h3>${esc(l.name)}</h3><div class="action-list">${Object.entries(l.actions).map(([aid,a])=>`<button class="button" data-loc="${id}" data-roam="${aid}"><b>${esc(a.label)}</b>${a.move?`<span>${esc(MOVE_LABEL[a.move]||a.move)}</span>`:''}</button>`).join('')}</div></div>`).join('')}</div></div>`;$$('[data-roam]').forEach(b=>b.onclick=()=>act({type:'free_roam_action',location:b.dataset.loc,actionId:b.dataset.roam},'Resolving Free Roam','The city continues while you decide what to notice.'));if($('#shareLatest'))$('#shareLatest').onclick=()=>{const privateClues=s.journal.private;const newest=privateClues[privateClues.length-1];if(newest)act({type:'share_clue',clueId:newest.clueId,source:last?.locationName||''},'Sharing evidence','What was private becomes part of the case you are building together.')};scheduleReadAloud()}
function renderBetaComplete(){const s=API.state;$('#main').innerHTML=`<div class="screen"><div class="hero"><img src="/media/art/scenes/ch01_pogodin_ritual_collage.webp"><div class="hero-brand"><img class="hero-symbol" src="/media/ui/motifs/kult_winged_emblem_red.png"><h1>Marked</h1><p>Chapter I beta boundary</p></div></div><div class="kicker">The Killers' Dance</div><h1 class="title">The story has changed you</h1><div class="copy"><p>The three Russians are gone. Whatever you believed the ritual would do, it did something else.</p><p>${s.flags.marked?.self?'You were one of the people who completed the rite. The touch it left on you is not a metaphor.':'Your partner crossed the final line of the rite. You witnessed what followed, but the mark itself was not placed on you.'}</p><p>This beta ends at the handoff into Chapter II. The multiplayer state, Story Lock flow, Free Roam, private/shared evidence, KULT Player Moves 2.0 rolls, presence, login, notifications, narration, and Chapter I vertical slice are active.</p></div></div>`;scheduleReadAloud()}
function renderPanel(){const s=API.state;if(nav==='case'){const items=journalTab==='shared'?s.journal.shared:s.journal.private;$('#main').innerHTML=`<div class="screen"><div class="kicker">Investigation</div><h1 class="title">Case File</h1><div class="journal-tabs"><button class="tab ${journalTab==='shared'?'active':''}" data-tab="shared">Shared Case File</button><button class="tab ${journalTab==='private'?'active':''}" data-tab="private">Personal Notes</button></div><div class="card">${items.length?items.map(x=>`<div class="evidence"><b>${esc(x.clue?.title||x.clueId)}</b><p>${esc(x.clue?.text||'')}</p>${journalTab==='private'&&!s.journal.shared.some(y=>y.clueId===x.clueId)?`<button class="button secondary" data-share="${esc(x.clueId)}">Tell partner / add to case file</button>`:''}</div>`).join(''):'<p class="muted">Nothing has been recorded here yet.</p>'}</div></div>`;$$('[data-tab]').forEach(b=>b.onclick=()=>{journalTab=b.dataset.tab;renderPanel()});$$('[data-share]').forEach(b=>b.onclick=()=>act({type:'share_clue',clueId:b.dataset.share},'Sharing evidence'));return}if(nav==='character'){const c=s.player.character;$('#main').innerHTML=`<div class="screen"><div class="kicker">Seat ${esc(s.seat)}</div><h1 class="title">${esc(c?.name||'Protagonist')}</h1><div class="card"><p><b>Occupation</b><br>${esc(c?.occupation||'')}</p><p><b>Stability</b><br>${esc(c?.stability||'Composed')}</p><p><b>Wounds</b><br>${c?.wounds?.length?c.wounds.map(esc).join(', '):'None recorded'}</p><p><b>Chagidiel's Mark</b><br>${s.flags.marked?.self?'Present':'Not present'}</p></div><div class="divider"></div><div class="card"><div class="kicker">Attributes</div><div class="attr-grid">${Object.entries(c?.attributes||{}).map(([k,v])=>`<div class="attr"><label>${esc(k)}</label><strong>${Number(v)>=0?'+':''}${esc(v)}</strong></div>`).join('')}</div></div></div>`;return}if(nav==='relations'){const partner=s.partner?.character?.name||'Other protagonist';$('#main').innerHTML=`<div class="screen"><div class="kicker">Relations</div><h1 class="title">People who matter</h1><div class="card"><h3 style="font-weight:400;margin-top:0">${esc(partner)}</h3><p class="muted">The beta records shared decisions and returns-to-partner behavior in the event history, but the full KULT Relations advancement layer will be expanded when the core rulebook is added.</p></div><div class="card"><h3 style="font-weight:400;margin-top:0">Magda Orlova</h3><p class="muted">Your campaign-linked relationship was chosen during character creation and is used as story context.</p></div></div>`;return}if(nav==='settings'){const read=localStorage.getItem('chagidielReadAloud')==='on';$('#main').innerHTML=`<div class="screen"><div class="kicker">System</div><h1 class="title">Settings</h1><div class="card"><h3 style="font-weight:400">Narration</h3><p class="muted">Read Aloud is ${read?'On':'Off'}. It reads rendered story text after the page settles and excludes unchosen controls.</p><button class="button secondary" id="voiceBtn">Narrator voice</button></div><div class="card"><h3 style="font-weight:400">Notifications</h3><p class="muted">Browser permission: ${'Notification'in window?Notification.permission:'unsupported'}. Remote beta alerts use the verified email/text identity when a provider is configured.</p><button class="button secondary" id="notifBtn">Request browser permission</button></div><div class="card"><h3 style="font-weight:400">Campaign</h3><p class="muted">${esc(API.campaign)}</p><button class="button secondary" id="leaveBtn">Leave this device session</button></div></div>`;$('#notifBtn').onclick=promptNotifications;$('#leaveBtn').onclick=()=>{localStorage.removeItem('chagidielToken');localStorage.removeItem('chagidielCampaign');location.reload()};$('#voiceBtn').onclick=voiceModal;return}}
async function voiceModal(){let voices=[];try{voices=(await request('/api/voices')).voices||[]}catch(e){}const selected=localStorage.getItem('chagidielVoice')||'54YYBuRuAG6KJooiOhFI';showModal(`<img class="modal-symbol" src="/media/ui/motifs/kult_winged_emblem_bone.png"><h2>Narrator voice</h2><div class="field"><label>Voice</label><select id="voiceSelect">${voices.map(v=>`<option value="${esc(v.voice_id)}" ${v.voice_id===selected?'selected':''}>${esc(v.name)}</option>`).join('')}</select></div><div class="modal-actions"><button class="button primary" id="saveVoice">Save</button><button class="button secondary" id="closeVoice">Close</button></div>`);$('#saveVoice').onclick=()=>{localStorage.setItem('chagidielVoice',$('#voiceSelect').value);hideModal();toast('Narration','Voice preference saved.')};$('#closeVoice').onclick=hideModal}
$$('.nav button').forEach(b=>b.onclick=()=>{nav=b.dataset.nav;renderApp()});
async function unlockAudio(){if(audioUnlocked)return;const a=$('#narration');try{const bytes=Uint8Array.from(atob('UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA='),c=>c.charCodeAt(0));const blob=new Blob([bytes],{type:'audio/wav'});a.src=URL.createObjectURL(blob);a.volume=.001;await a.play();a.pause();a.currentTime=0;audioUnlocked=true}catch(e){}}
$('#readSwitch').onclick=async()=>{const on=localStorage.getItem('chagidielReadAloud')==='on';localStorage.setItem('chagidielReadAloud',on?'off':'on');$('#readSwitch').classList.toggle('on',!on);$('#readSwitch').setAttribute('aria-checked',String(!on));if(!on){await unlockAudio();scheduleReadAloud(true)}else{$('#narration').pause()}}
function readSwitchSync(){const on=localStorage.getItem('chagidielReadAloud')==='on';$('#readSwitch').classList.toggle('on',on);$('#readSwitch').setAttribute('aria-checked',String(on))}
function collectNarration(){const root=$('#main');if(!root)return'';const clone=root.cloneNode(true);clone.querySelectorAll('button,input,select,.choices,.ready-grid,.lock-banner,.roll-inline').forEach(x=>x.remove());return clone.innerText.replace(/\n{3,}/g,'\n\n').trim()}
function chunks(text,max=3400){const paras=text.split(/\n\n+/);const out=[];let cur='';for(const p of paras){if((cur+'\n\n'+p).length>max&&cur){out.push(cur);cur=p}else cur+=(cur?'\n\n':'')+p}if(cur)out.push(cur);return out}
async function scheduleReadAloud(force=false){readSwitchSync();if(localStorage.getItem('chagidielReadAloud')!=='on'||readBusy)return;await new Promise(r=>setTimeout(r,420));const text=collectNarration();if(!text)return;const key=`${API.state?.revision||0}:${API.state?.current?.scene||nav}:${API.state?.current?.beat||0}:${nav}`;if(!force&&key===lastNarratedKey)return;lastNarratedKey=key;readBusy=true;try{await unlockAudio();const voice=localStorage.getItem('chagidielVoice')||'54YYBuRuAG6KJooiOhFI';let n=0;for(const part of chunks(text)){const r=await fetch('/api/narration-page',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({scene:(API.state?.current?.scene||'page')+'_'+n++,voice,text:part})});if(!r.ok)throw new Error('Narration unavailable');const blob=await r.blob(),u=URL.createObjectURL(blob),a=$('#narration');a.src=u;a.volume=1;await a.play();await new Promise((res,rej)=>{a.onended=res;a.onerror=rej});URL.revokeObjectURL(u)}}catch(e){toast('Read Aloud','Narration could not play. Check the ElevenLabs Worker configuration.')}finally{readBusy=false}}
async function notifyLocal(title,body){try{if('serviceWorker'in navigator){const r=await navigator.serviceWorker.ready;r.showNotification(title,{body,icon:'/media/ui/motifs/kult_winged_emblem_red.png',badge:'/media/ui/motifs/kult_winged_emblem_red.png'})}}catch(e){}}
document.addEventListener('pointerdown',()=>{if(localStorage.getItem('chagidielReadAloud')==='on')unlockAudio()},{once:true});
readSwitchSync();if(API.token&&API.campaign)loadState();else route();
</script>
</body></html>
