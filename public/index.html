<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const API={token:localStorage.getItem('chagidielToken')||'',campaign:localStorage.getItem('chagidielCampaign')||'',state:null,ws:null,preview:false,user:null,characters:null,drafts:null,campaigns:null};
const MOVE_LABEL={act_under_pressure:'Act Under Pressure +Reflexes',endure_injury:'Endure Injury +Fortitude',keep_it_together:'Keep It Together +Willpower',engage_in_combat:'Engage in Combat +Violence',employ_stealth:'Employ Stealth +Coolness',influence_other:'Influence Other +Charisma',observe_situation:'Observe a Situation +Perception',read_person:'Read a Person +Intuition',see_through_illusion:'See Through the Illusion +Soul',investigate:'Investigate +Reason',improvised:'Improvised Move'};
const tensionLines=['The world considers your choice.','Nothing moves. That does not mean nothing has changed.','Some answers arrive only after the question becomes dangerous.','You have committed to the moment. Now it commits to you.','The pause is brief. It does not feel brief.'];
let nav='story', journalTab='shared', lastPresence=false, readBusy=false, audioUnlocked=false, audioUnlockPromise=null, silentNarrationUrl='', pendingNarrationRetry=false, narrationUnlockNoticeShown=false, lastNarratedKey='', narrationAbortController=null, narrationProgressHideTimer=null, creatorDraft=null, creatorMode='new', editingCharacterId=null, creatorAssignAfterSave=false, creatorDraftId=null, creatorDraftSaveTimer=null, creatorDraftCreatePromise=null, creatorAutosaveState='saved', wakeLock=null;
function pendingInvite(){try{return JSON.parse(localStorage.getItem('chagidielPendingInvite')||'null')}catch(_){return null}}
function captureInviteFromUrl(){const q=new URLSearchParams(location.search),campaignId=(q.get('campaign')||'').trim(),invite=(q.get('invite')||'').trim().toUpperCase();if(/^c_[a-f0-9]+$/.test(campaignId)&&/^[A-Z0-9]{6,16}$/.test(invite)){const data={campaignId,invite};localStorage.setItem('chagidielPendingInvite',JSON.stringify(data));return data}return pendingInvite()}
function clearPendingInvite(cleanUrl=true){localStorage.removeItem('chagidielPendingInvite');if(cleanUrl&&location.search){const q=new URLSearchParams(location.search);q.delete('campaign');q.delete('invite');const next=q.toString()?`${location.pathname}?${q}`:location.pathname;history.replaceState({},'',next)}}
function inviteLink(campaignId,code){return `${location.origin}${location.pathname}?campaign=${encodeURIComponent(campaignId)}&invite=${encodeURIComponent(code)}`}
async function copyText(value,label='Invite'){try{await navigator.clipboard.writeText(value);toast(label,'Copied.')}catch(_){const el=document.createElement('textarea');el.value=value;el.style.position='fixed';el.style.opacity='0';document.body.appendChild(el);el.select();document.execCommand('copy');el.remove();toast(label,'Copied.')}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(title,text){const t=$('#toast');t.querySelector('b').textContent=title;t.querySelector('span').textContent=text;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3200)}
function showResolve(title='Resolving',line=null){$('#resolveTitle').textContent=title;$('#resolveLine').textContent=line||tensionLines[Math.floor(Math.random()*tensionLines.length)];$('#resolveOverlay').classList.add('open')}
function hideResolve(){ $('#resolveOverlay').classList.remove('open') }
function showModal(html){$('#modal').innerHTML=html;$('#modalOverlay').classList.add('open')}
function hideModal(){ $('#modalOverlay').classList.remove('open') }
async function request(path,opts={}){const headers=new Headers(opts.headers||{});if(API.token)headers.set('authorization','Bearer '+API.token);if(opts.body&&!headers.has('content-type'))headers.set('content-type','application/json');let r;try{r=await fetch(path,{...opts,headers})}catch(e){throw new Error('Unable to reach The Black Madonna server. Try again in a moment.')}const ct=r.headers.get('content-type')||'';let data;if(ct.includes('json')){try{data=await r.json()}catch(_){data={error:'The server returned an unreadable response.'}}}else{const text=await r.text();data={error:r.ok?text:`The Black Madonna server error (${r.status}). Check Cloudflare Worker logs if this continues.`}}if(!r.ok){const base=data?.error||data?.warning||`Request failed (${r.status}).`;const detail=data?.detail&&data.detail!==base?' — '+data.detail:'';throw new Error(base+detail)}return ct.includes('json')?data:(data.error||'')}
async function loadCharacterLibrary(force=false){if(API.characters&&!force)return API.characters;const d=await request('/api/characters');API.characters=d.characters||[];return API.characters}
async function loadCharacterDrafts(force=false){if(API.drafts&&!force)return API.drafts;const d=await request('/api/character-drafts');API.drafts=d.drafts||[];return API.drafts}
async function loadCampaignMemory(){const d=await request('/api/campaigns/mine');API.campaigns=d;return d}
async function loadCampaignLibrary(){const d=await request('/api/campaigns/library');API.campaigns=d;return d}
async function resumeAccount(){
  if(!API.token)return renderLogin();
  if(pendingInvite()){API.campaign='';return renderHub()}
  if(API.campaign){await loadState();return}
  return renderHub();

function updatePresence(){const el=$('#presence'),menu=$('#presenceMenu');if(!el||!menu)return;const s=API.state;if(!s){el.classList.remove('online');el.querySelector('b').textContent='Party';el.querySelector('span').textContent='No campaign';menu.classList.add('hidden');return}const others=s.companions||[],online=others.filter(x=>x.online),joined=others.filter(x=>x.character);el.classList.toggle('online',online.length>0);el.querySelector('b').textContent=online.length?`${online.length} online`:(joined.length?'Party':'Waiting');el.querySelector('span').textContent=joined.length?`${joined.length+1} protagonist${joined.length?'s':''}`:'Only you';const rows=[{seat:s.seat,character:s.player?.character,online:true,lastSeen:Date.now(),self:true},...others];menu.innerHTML=`<div class="presence-menu-head">Campaign presence</div>${rows.map(p=>`<div class="presence-row ${p.online?'online':''}"><i class="presence-row-dot"></i><div class="presence-row-main"><b>${esc(p.character?.name||`Seat ${p.seat}`)}${p.self?' · You':''}</b><span>Seat ${esc(p.seat)}${p.seat==='C'?' · optional':''}</span></div><div class="presence-row-state">${p.online?'Online':relativeSeen(p.lastSeen)}</div></div>`).join('')}`}
function togglePresenceMenu(e){e?.stopPropagation();const menu=$('#presenceMenu'),button=$('#presence');if(!menu||!button)return;const open=menu.classList.contains('hidden');menu.classList.toggle('hidden',!open);button.setAttribute('aria-expanded',String(open))}

function creatorOrigin(){const d=creatorDraft,regions=ORIGIN_REGIONS[d.country]||ORIGIN_REGIONS.other_europe;return `<div class="creator-intro"><div class="kicker">I — Identity & Origin</div><h1 class="title">Before Germany</h1><p>KULT characters are people with histories before the horror finds them. This stage establishes where you come from and how you became part of Germany in 1991.</p></div><div class="card">${cSelect('c-country','Country of origin',Object.entries(ORIGIN_LABELS),d.country)}${cSelect('c-region','Region of origin',regions,d.region)}${cSelect('c-base','Where you live/work in Germany now',CURRENT_BASES,d.currentBase)}${cSelect('c-history','Your history in Germany',Object.entries(GERMANY_HISTORY),d.germanyHistory)}${cSelect('c-reason','What brought or kept you here',Object.entries(GERMANY_REASON),d.germanyReason)}${cSelect('c-age','Age in 1991',AGE_BANDS,d.ageBand)}${cSelect('c-presentation','Everyday presentation',Object.entries(PRESENTATIONS),d.presentation)}<div class="live-desc"><b>Campaign constraint</b><p><em>The Black Madonna</em> allows non-German protagonists, but says they should at minimum live and work in Germany. Origin and German history also matter to several Magda relationship requirements.</p></div></div>`}
