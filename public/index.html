<div class="app">

    <div><div class="brand-kicker">KULT: Divinity Lost</div><div class="brand">CHAGIDIEL</div></div>
    <div style="display:flex;align-items:center;gap:9px">
      <div class="read-toggle"><label>Read Aloud</label><div class="switch" id="readSwitch" role="switch" aria-checked="false"><i></i></div></div>

</div></nav>
<div class="overlay" id="resolveOverlay"><div class="resolve-inner"><img class="resolve-symbol" src="/media/ui/motifs/kult_winged_emblem_red.png"><div class="resolve-title" id="resolveTitle">Resolving</div><div class="resolve-line" id="resolveLine">The world considers your choice.</div><div class="resolve-fracture"></div></div></div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const API={token:localStorage.getItem('chagidielToken')||'',campaign:localStorage.getItem('chagidielCampaign')||'',state:null,ws:null,preview:false,user:null,characters:null,campaigns:null};
const MOVE_LABEL={act_under_pressure:'Act Under Pressure +Reflexes',endure_injury:'Endure Injury +Fortitude',keep_it_together:'Keep It Together +Willpower',engage_in_combat:'Engage in Combat +Violence',employ_stealth:'Employ Stealth +Coolness',influence_other:'Influence Other +Charisma',observe_situation:'Observe a Situation +Perception',read_person:'Read a Person +Intuition',see_through_illusion:'See Through the Illusion +Soul',investigate:'Investigate +Reason',improvised:'Improvised Move'};
const tensionLines=['The world considers your choice.','Nothing moves. That does not mean nothing has changed.','Some answers arrive only after the question becomes dangerous.','You have committed to the moment. Now it commits to you.','The pause is brief. It does not feel brief.'];
let nav='story', journalTab='shared', lastPresence=false, readBusy=false, audioUnlocked=false, lastNarratedKey='', creatorDraft=null, creatorMode='new', editingCharacterId=null, creatorAssignAfterSave=false, wakeLock=null;
function pendingInvite(){try{return JSON.parse(localStorage.getItem('chagidielPendingInvite')||'null')}catch(_){return null}}
function captureInviteFromUrl(){const q=new URLSearchParams(location.search),campaignId=(q.get('campaign')||'').trim(),invite=(q.get('invite')||'').trim().toUpperCase();if(/^c_[a-f0-9]+$/.test(campaignId)&&/^[A-Z0-9]{6,16}$/.test(invite)){const data={campaignId,invite};localStorage.setItem('chagidielPendingInvite',JSON.stringify(data));return data}return pendingInvite()}
function clearPendingInvite(cleanUrl=true){localStorage.removeItem('chagidielPendingInvite');if(cleanUrl&&location.search){const q=new URLSearchParams(location.search);q.delete('campaign');q.delete('invite');const next=q.toString()?`${location.pathname}?${q}`:location.pathname;history.replaceState({},'',next)}}
function inviteLink(campaignId,code){return `${location.origin}${location.pathname}?campaign=${encodeURIComponent(campaignId)}&invite=${encodeURIComponent(code)}`}
async function copyText(value,label='Invite'){try{await navigator.clipboard.writeText(value);toast(label,'Copied.')}catch(_){const el=document.createElement('textarea');el.value=value;el.style.position='fixed';el.style.opacity='0';document.body.appendChild(el);el.select();document.execCommand('copy');el.remove();toast(label,'Copied.')}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(title,text){const t=$('#toast');t.querySelector('b').textContent=title;t.querySelector('span').textContent=text;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3200)}
function showResolve(title='Resolving',line=null){$('#resolveTitle').textContent=title;$('#resolveLine').textContent=line||tensionLines[Math.floor(Math.random()*tensionLines.length)];$('#resolveOverlay').classList.add('open')}
function hideResolve(){ $('#resolveOverlay').classList.remove('open') }
function showModal(html){$('#modal').innerHTML=html;$('#modalOverlay').classList.add('open')}
function hideModal(){ $('#modalOverlay').classList.remove('open') }
async function request(path,opts={}){const headers=new Headers(opts.headers||{});if(API.token)headers.set('authorization','Bearer '+API.token);if(opts.body&&!headers.has('content-type'))headers.set('content-type','application/json');let r;try{r=await fetch(path,{...opts,headers})}catch(e){throw new Error('Unable to reach the Chagidiel server. Try again in a moment.')}const ct=r.headers.get('content-type')||'';let data;if(ct.includes('json')){try{data=await r.json()}catch(_){data={error:'The server returned an unreadable response.'}}}else{const text=await r.text();data={error:r.ok?text:`Chagidiel server error (${r.status}). Check Cloudflare Worker logs if this continues.`}}if(!r.ok){const base=data?.error||data?.warning||`Request failed (${r.status}).`;const detail=data?.detail&&data.detail!==base?' — '+data.detail:'';throw new Error(base+detail)}return ct.includes('json')?data:(data.error||'')}
async function loadCharacterLibrary(force=false){if(API.characters&&!force)return API.characters;const d=await request('/api/characters');API.characters=d.characters||[];return API.characters}
async function loadCampaignMemory(){const d=await request('/api/campaigns/mine');API.campaigns=d;return d}
async function resumeAccount(){
  if(!API.token)return renderLogin();
  if(pendingInvite()){API.campaign='';return renderHub()}
  if(API.campaign){await loadState();return}
  try{const d=await loadCampaignMemory();if(d.lastId){API.campaign=d.lastId;localStorage.setItem('chagidielCampaign',d.lastId);await loadState();return}}catch(e){}
  route();
}
function route(){if(!API.token)return renderLogin();if(!API.campaign)return renderHub();if(!API.state)return renderLoading();renderApp()}
function shell(show=true){$('#topbar').classList.toggle('hidden',!show);$('#bottomNav').classList.toggle('hidden',!show)}

async function signIn(){
  const email=$('#loginEmail').value.trim(),password=$('#loginPassword').value;
  if(!email||!password)return toast('Sign in','Enter your email and password.');
  showResolve('Signing in','The door recognizes an account, not a device.');
  try{
    const d=await request('/api/auth/login',{method:'POST',body:JSON.stringify({email,password})});
    API.token=d.token;API.user=d.user;API.characters=null;localStorage.setItem('chagidielToken',d.token);hideResolve();await promptNotifications();await resumeAccount();
  }catch(e){hideResolve();toast('Sign in',e.message)}
}

async function registerAccount(){

    const d=await request('/api/auth/register',{method:'POST',body:JSON.stringify({email,password})});
    API.token=d.token;API.user=d.user;API.characters=null;localStorage.setItem('chagidielToken',d.token);hideModal();await promptNotifications();await resumeAccount();

async function finishPasswordReset(token){
  const password=$('#resetPassword').value,confirm=$('#resetPassword2').value;if(password!==confirm)return toast('Password reset','Passwords do not match.');
  showResolve('Changing password','The old key is being discarded.');
  try{
    await request('/api/auth/reset',{method:'POST',body:JSON.stringify({token,password})});
    API.token='';API.user=null;API.campaign='';API.state=null;localStorage.removeItem('chagidielToken');localStorage.removeItem('chagidielCampaign');history.replaceState({},'',location.pathname);hideResolve();toast('Password reset','Password changed. Sign in with the new password.');renderLogin();
  }catch(e){hideResolve();toast('Password reset',e.message)}
}

async function promptNotifications(){if(localStorage.getItem('chagidielNotifAsked'))return;localStorage.setItem('chagidielNotifAsked','1');showModal(`<img class="modal-symbol" src="/media/ui/motifs/kult_winged_emblem_red.png"><h2>Story notifications</h2><p>Chagidiel can alert you when the other protagonist reaches a Story Lock or your decision is required. Browser notifications are requested here. Email alerts can also be used when outbound email is configured.</p><div class="modal-actions"><button class="button primary" id="enableNotif">Enable notifications</button><button class="button secondary" id="skipNotif">Not now</button></div>`);$('#skipNotif').onclick=hideModal;$('#enableNotif').onclick=async()=>{try{if('serviceWorker'in navigator)await navigator.serviceWorker.register('/sw.js');if('Notification'in window)await Notification.requestPermission();}catch(e){}hideModal()}}

aign</button></div></div></div>`;

function signOut(){localStorage.removeItem('chagidielToken');localStorage.removeItem('chagidielCampaign');API.token='';API.campaign='';API.state=null;API.user=null;API.characters=null;API.campaigns=null;if(API.ws)try{API.ws.close()}catch(e){};API.ws=null;route()}

async function createCampaign(){showResolve('Creating campaign');try{const d=await request('/api/campaigns',{method:'POST'});API.campaign=d.state.id;API.state=d.state;localStorage.setItem('chagidielCampaign',API.campaign);hideResolve();connectWs();renderApp();showCampaignInviteManager()}catch(e){hideResolve();toast('Campaign',e.message)}}
async function joinCampaign(){const campaignId=$('#joinCampaign').value.trim(),invite=$('#joinInvite').value.trim().toUpperCase();showResolve('Joining campaign');try{const d=await request('/api/campaigns/join',{method:'POST',body:JSON.stringify({campaignId,invite})});API.campaign=campaignId;API.state=d.state;localStorage.setItem('chagidielCampaign',campaignId);clearPendingInvite();hideResolve();connectWs();renderApp();promptNotifications()}catch(e){hideResolve();toast('Join campaign',e.message)}}
async function loadState(){if(!API.campaign)return;try{const d=await request(`/api/campaigns/${API.campaign}/state`);API.state=d.state;connectWs();renderApp()}catch(e){localStorage.removeItem('chagidielCampaign');API.campaign='';API.state=null;toast('Campaign',e.message);route()}}
function connectWs(){if(!API.campaign||!API.token||API.ws)return;try{const u=new URL(location.href);u.protocol=u.protocol==='https:'?'wss:':'ws:';u.pathname=`/api/campaigns/${API.campaign}/ws`;u.search='?token='+encodeURIComponent(API.token);const ws=new WebSocket(u);API.ws=ws;ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='state'){const was=!!API.state?.partner?.online;API.state=m.state;const now=!!m.state?.partner?.online;if(!was&&now&&Notification.permission==='granted'&&document.hidden)notifyLocal('Chagidiel','The other protagonist is online.');renderApp()}}catch(_){}};ws.onclose=()=>{API.ws=null;setTimeout(connectWs,1800)};ws.onerror=()=>{};}catch(e){}}
async function act(body,title='Resolving',line=null){showResolve(title,line);const start=Date.now();try{const payload={...body,clientActionId:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random())};const d=await request(`/api/campaigns/${API.campaign}/action`,{method:'POST',body:JSON.stringify(payload)});const wait=Math.max(0,900-(Date.now()-start));await new Promise(r=>setTimeout(r,wait));API.state=d.state;hideResolve();renderApp();return d.state}catch(e){hideResolve();toast('Chagidiel',e.message);throw e}}

  bookseller:{name:'Rare Book Dealer',archetype:'The Occultist',desc:'A dealer in rare and illicit books whose trade has brought genuine occult material into reach.',languages:'German native; English fluent; French, Hebrew, Latin, Greek, Arabic broken.',q1:'What are you hoping to find?',a1:['A text that proves a ritual tradition is real','A lost collection tied to prewar Berlin','A book a dead client insisted could not be destroyed'],q2:'Why did your last deal go wrong?',a2:['The buyer vanished after taking delivery','The seller was found dead before payment','The book I delivered was not the same book I bought']},
  kgb:{name:'Defected KGB Operative',archetype:'The Ronin',desc:'A former KGB officer who faked death after the Wall fell and assumed a West Berliner identity.',languages:'Russian native; German and English fluent.',q1:'Why did you defect?',a1:['I learned what my section was really doing','I was ordered to destroy someone I cared about','I saw the Soviet collapse coming and chose survival'],q2:'What became of the identity you assumed?',a2:['The real person died because of me','The real person disappeared and may still be alive','I was given the identity by someone who now owns a favor']},
  literary_agent:{name:'Literary Agent',archetype:'The Deceiver',desc:'A new agent at Goldmann Arkana, specializing in esoteric and New Age publishing and desperate to prove worth.',languages:'German native; English and French fluent; Russian broken.',q1:'How did you get the Goldmann Arkana job?',a1:['I took credit for someone else’s discovery','I charmed an editor who should have known better','I delivered a manuscript nobody else could obtain'],q2:'What keeps you awake at night?',a2:['Fear that someone will expose how I got here','A manuscript I cannot stop rereading','The suspicion that one of my authors knows too much about me']}

const DARK_SECRET_DEFS={
  broken_childhood:{name:'Broken Childhood',desc:'Childhood abuse left recurring nightmares and an enduring fear response.',q1:'What became of your foster parents?',a1:['I forgave them but keep my distance','I never forgave them','One is dead; the other still writes to me'],q2:'What remains with you?',a2:['Scars on my hands and arms','Panic in confined spaces','I cannot sleep with a closed bedroom door']},
  mental_illness:{name:'Mental Illness',desc:'Past psychotic episodes led to institutionalization; medication and fear of relapse remain part of daily life.',q1:'Who knows the full history?',a1:['Only my doctor and one relative','Magda knows more than anyone else','A former colleague knows and has kept quiet'],q2:'What do you fear if the medication is lost?',a2:['The voices and images will return','I will lose time and wake somewhere else','I will be institutionalized again']},
  secret_past:{name:'Secret Past',desc:'You informed for the Stasi and helped expose people attempting to flee East Germany.',q1:'Whom did you condemn?',a1:['A family with two children','A colleague who trusted me','A young couple planning to cross the border'],q2:'Did anyone escape?',a2:['One survivor lives somewhere in West Berlin','I never learned what happened to them','I believe everyone I named was caught']},
  strange_death:{name:'Strange Death',desc:'Someone close died in Berlin under circumstances that looked supernatural, and you never stopped investigating.',q1:'Who were they to you?',a1:['My closest friend','My sibling','A former lover'],q2:'Why do you blame yourself?',a2:['I ignored their last phone call','I sent them to the place where they died','I convinced them the danger was imaginary']},
  occult_fascination:{name:'Occult Fascination',desc:'You have spent years studying occult texts and failed rituals, becoming more obsessed rather than less.',q1:'What began the obsession?',a1:['A book found in a dead relative’s possessions','A ritual I witnessed as a teenager','An impossible event nobody else remembers'],q2:'Who paid the price for it?',a2:['A partner who eventually left','A friend I dragged into an investigation','A colleague whose career I damaged']},
  guilty:{name:'Guilty',desc:'You harmed a child through a serious crime or betrayal and carry persistent guilt.',q1:'Who was the child?',a1:['A relative I was supposed to protect','A witness whose trust I exploited','A stranger caught in something I caused'],q2:'What did you do?',a2:['I abandoned them in a dangerous situation','I falsified evidence that ruined their life','I used violence and have never forgiven myself']},
  addict:{name:'Addict',desc:'You survived heroin addiction and are clean, but the hunger and the damage to old relationships remain.',q1:'What helped you get clean?',a1:['A friend who refused to abandon me','A treatment program after an overdose','Magda gave me a place to stay and start again'],q2:'Which relationship are you trying to repair?',a2:['My family','A former lover','A friend I stole from repeatedly']},
  flashbacks:{name:'Flashbacks',desc:'Alien memories of a frozen city, hunger, explosions, and terror intrude into ordinary life.',q1:'What triggers them?',a1:['Bitter cold and the smell of coal smoke','Hunger or seeing ration lines','Distant explosions, fireworks, or construction blasts'],q2:'What frightens you most about them?',a2:['They feel more real than my actual memories','I recognize people I have never met','I am starting to remember what happened next']}

const FAMILY_DEFS={
  alone:{name:'Alone with Few Friends',relation:'Pet — Meaningful (1)',desc:'No family, few relationships, and a pet that provides uncomplicated comfort.',q1:'Why do relationships fail?',a1:['I disappear when people get too close','I expect betrayal before it happens','Work and obsession always come first'],q2:'What pet waits for you?',a2:['A cat','A dog','A bird']},
  fiance:{name:'Fiancé/Fiancée with a Child on the Way',relation:'Partner — Vital (2)',desc:'An engagement, a pregnancy, and a sincere belief that a better future is possible.',q1:'What defines your partner?',a1:['Patient and practical','Ambitious and fiercely loyal','Warm, impulsive, and impossible to intimidate'],q2:'How do you feel about becoming a parent?',a2:['Terrified but hopeful','Certain this will finally make me settle down','Afraid I will repeat my own family’s mistakes']},
  divorced:{name:'Divorced, but Feelings Remain',relation:'Former spouse — Vital (2)',desc:'The marriage ended; your attachment did not.',q1:'Who was your spouse?',a1:['A childhood sweetheart','Someone I met through work','A person whose family never accepted me'],q2:'What ended the marriage?',a2:['My work consumed everything','A betrayal neither of us could forget','We wanted incompatible lives']},
  accident:{name:'Family Died in an Accident',relation:'Supportive friend — Meaningful (1)',desc:'A family and future vanished in a sudden accident; their belongings remain packed away.',q1:'Who did you lose?',a1:['A spouse and child','My parents and sibling','My partner and their family'],q2:'Who was responsible?',a2:['A drunk driver','An employer who ignored safety warnings','Officially nobody; I do not believe the report']},
  casual:{name:'Single with Lots of Casual Sex',relation:'Party friend — Meaningful (1)',desc:'Berlin and Hamburg nightlife have become an arena for intimacy without permanence.',q1:'Who do you tend to wake up beside?',a1:['Artists and musicians','People passing through the city','People whose names I sometimes never learn'],q2:'Who broke your heart?',a2:['The person who taught me not to stay','A married lover','Someone who disappeared without explanation']},
  joyless:{name:'Joyless Marriage',relation:'Spouse — Meaningful (1)',desc:'A cold marriage survives through habit, logistics, and the difficulty of leaving.',q1:'Why haven’t you left?',a1:['Money and housing','Family expectations','I am more afraid of being alone'],q2:'What do you resent most?',a2:['The constant silence','The contempt disguised as politeness','How easily we lie to other people about being happy']},
  destructive:{name:'Destructive Relationship',relation:'Significant other — Vital (2)',desc:'Passion, arguments, reconciliation, and damage repeat in a cycle neither of you seems able to end.',q1:'What did you give up for them?',a1:['A job opportunity','A close friendship','Contact with part of my family'],q2:'Where did you first meet?',a2:['A hospital waiting room','A train stranded overnight','A police station after separate arrests']},
  abusive:{name:'Abusive Marriage',relation:'Spouse — Vital (2)',desc:'The marriage is governed by fear, violence, and the memory of a child who died.',q1:'What is your position in the violence?',a1:['I am the victim','I am the perpetrator','The roles have changed over time'],q2:'What happened to the child?',a2:['An illness we handled terribly','An accident during an argument','A death neither of us talks about honestly']},
  happy:{name:'Happy Marriage',relation:'Spouse — Vital (2)',desc:'A genuinely loving marriage, shadowed only by the inability to have children.',q1:'What makes your spouse extraordinary to you?',a1:['They make ordinary life feel safe','They challenge every lie I tell myself','They know exactly when to leave me alone'],q2:'What do you love doing together?',a2:['Long weekend train trips','Cooking late at night','Walking the city with nowhere to be']}
};
const MAGDA_DEFS={
  child:{name:'Child of Magda Orlova',rating:'Meaningful (1)',req:'Age 23–29 and born in East Germany.',desc:'Social services took you from Magda when you were very young; you have only recently reconnected.'},
  journalism:{name:'Knows Her through Her Journalism',rating:'Neutral (0)',req:'In Germany during the 1980s and connected to journalism or the black market.',desc:'You knew Magda through her 1980s freelance reporting and kept intermittent contact.'},
  bookstore:{name:'Got to Know Her through Her Antique Bookstore',rating:'Neutral (0)',req:'Present in East Berlin in 1971–72 or West Berlin in 1977–80.',desc:'You repeatedly visited one of Magda’s Berlin bookstores and came to know her there.'},
  friend:{name:'Friend of a Friend',rating:'Neutral (0)',req:'Spent at least a couple of years in Germany.',desc:'Someone close to you knows Magda; you have met her several times without becoming close.'},
  helped:{name:'Helped You Out',rating:'Meaningful (1)',req:'Spent at least a couple of years in Germany.',desc:'Magda supported you through a serious low point and you have never forgotten it.'},
  lover:{name:'Former Lover',rating:'Meaningful (1)',req:'In East Berlin during 1958–62 and old enough for the relationship.',desc:'You and Magda had a troubled but amicably ended affair and remained in touch.'},
  literary:{name:'Literary Circles in Berlin and Hamburg',rating:'Neutral (0)',req:'Lived in or repeatedly visited Germany.',desc:'You know Magda through release parties, book events, writers, publishers, and literary society.'}

const PASSIVE_ATTRS=['fortitude','reflexes','willpower'];
const ACTIVE_ATTRS=['charisma','coolness','intuition','perception','reason','soul','violence'];
const ATTR_LABELS={fortitude:'Fortitude',reflexes:'Reflexes',willpower:'Willpower',charisma:'Charisma',coolness:'Coolness',intuition:'Intuition',perception:'Perception',reason:'Reason',soul:'Soul',violence:'Violence'};
function newCreatorDraft(from=null){
  if(from){const c=from.character||from,o=c.origin||{};return {stage:0,country:o.country||'germany',region:o.region||ORIGIN_REGIONS.germany[0],currentBase:o.currentBase||'Berlin',germanyHistory:o.germanyHistory||'eighties_early',germanyReason:o.germanyReason||'career',ageBand:c.ageBand||'30–39',presentation:c.presentation||'professional',namingStyle:c.namingStyle||'unrestricted',firstName:c.firstName||String(c.name||'').split(' ')[0]||'',lastName:c.lastName||String(c.name||'').split(' ').slice(1).join(' ')||'',occupation:c.occupation||'journalist',occupationAnswers:[...(c.occupationAnswers||OCCUPATION_DEFS.journalist.a1.slice(0,1).concat(OCCUPATION_DEFS.journalist.a2.slice(0,1)))].slice(0,2),darkSecret:c.darkSecret||'strange_death',darkSecretAnswers:[...(c.darkSecretAnswers||[DARK_SECRET_DEFS.strange_death.a1[0],DARK_SECRET_DEFS.strange_death.a2[0]])].slice(0,2),family:c.family||'alone',familyAnswers:[...(c.familyAnswers||[FAMILY_DEFS.alone.a1[0],FAMILY_DEFS.alone.a2[0]])].slice(0,2),relation:c.relation||'friend',attributes:{fortitude:2,reflexes:1,willpower:0,charisma:0,coolness:1,intuition:2,perception:1,reason:3,soul:-2,violence:-1,...(c.attributes||{})}}}
  return {stage:0,country:'germany',region:ORIGIN_REGIONS.germany[0],currentBase:'Berlin',germanyHistory:'eighties_early',germanyReason:'career',ageBand:'30–39',presentation:'professional',namingStyle:'unrestricted',firstName:'',lastName:'',occupation:'journalist',occupationAnswers:[OCCUPATION_DEFS.journalist.a1[0],OCCUPATION_DEFS.journalist.a2[0]],darkSecret:'strange_death',darkSecretAnswers:[DARK_SECRET_DEFS.strange_death.a1[0],DARK_SECRET_DEFS.strange_death.a2[0]],family:'alone',familyAnswers:[FAMILY_DEFS.alone.a1[0],FAMILY_DEFS.alone.a2[0]],relation:'friend',attributes:{fortitude:2,reflexes:1,willpower:0,charisma:0,coolness:1,intuition:2,perception:1,reason:3,soul:-2,violence:-1}}
}
function cOpt(value,label,current){return `<option value="${esc(value)}" ${String(value)===String(current)?'selected':''}>${esc(label)}</option>`}
function cSelect(id,label,values,current){return `<div class="field"><label>${esc(label)}</label><select id="${id}">${values.map(v=>Array.isArray(v)?cOpt(v[0],v[1],current):cOpt(v,v,current)).join('')}</select></div>`}
function creatorStagebar(){return `<div class="creator-stagebar">${CREATOR_STAGES.map((x,i)=>`<button class="creator-step ${i===creatorDraft.stage?'active':''} ${i<creatorDraft.stage?'done':''}" data-creator-jump="${i}" ${i>creatorDraft.stage?'disabled':''}><span>${i+1}</span>${esc(x)}</button>`).join('')}</div>`}
function ageBandNumber(){return Number(String(creatorDraft.ageBand).match(/\d+/)?.[0]||0)}
function magdaRequirementState(id){const d=creatorDraft,m=MAGDA_DEFS[id];if(id==='child'){const east=d.country==='germany'&&/East Berlin|Saxony|Thuringia|Mecklenburg|Saxony-Anhalt|Brandenburg/.test(d.region);return d.ageBand==='23–29'&&east?{ok:true,text:m.req}:{ok:false,text:'This choice conflicts with the published requirement: '+m.req}}if(id==='journalism'){const early=!['recent','visitor'].includes(d.germanyHistory);const occ=['journalist','black_marketeer'].includes(d.occupation);return early&&occ?{ok:true,text:m.req}:{ok:false,text:'Published requirement: '+m.req+' Your current background may not satisfy it.'}}if(id==='bookstore'){const old=['before_1970','seventies'].includes(d.germanyHistory);const berlin=d.currentBase==='Berlin';return old&&berlin?{ok:true,text:m.req}:{ok:false,text:'Published requirement: '+m.req+' Your current timeline does not clearly establish this.'}}if(id==='friend'||id==='helped'){const ok=!['recent','visitor'].includes(d.germanyHistory);return ok?{ok:true,text:m.req}:{ok:false,text:'Published requirement: '+m.req}}if(id==='lover'){const ok=d.germanyHistory==='before_1970'&&ageBandNumber()>=50;return ok?{ok:true,text:m.req}:{ok:false,text:'Published requirement: '+m.req+' Your age/history selection does not establish this.'}}return {ok:true,text:m.req}}
function creatorOrigin(){const d=creatorDraft,regions=ORIGIN_REGIONS[d.country]||ORIGIN_REGIONS.other_europe;return `<div class="creator-intro"><div class="kicker">I — Identity & Origin</div><h1 class="title">Before Germany</h1><p>KULT characters are people with histories before the horror finds them. This stage establishes where you come from and how you became part of Germany in 1991.</p></div><div class="card">${cSelect('c-country','Country of origin',Object.entries(ORIGIN_LABELS),d.country)}${cSelect('c-region','Region of origin',regions,d.region)}${cSelect('c-base','Where you live/work in Germany now',CURRENT_BASES,d.currentBase)}${cSelect('c-history','Your history in Germany',Object.entries(GERMANY_HISTORY),d.germanyHistory)}${cSelect('c-reason','What brought or kept you here',Object.entries(GERMANY_REASON),d.germanyReason)}${cSelect('c-age','Age in 1991',AGE_BANDS,d.ageBand)}${cSelect('c-presentation','Everyday presentation',Object.entries(PRESENTATIONS),d.presentation)}<div class="live-desc"><b>Campaign constraint</b><p><em>The Black Madonna</em> allows non-German protagonists, but says they should at minimum live and work in Germany. Origin and German history also matter to several Magda relationship requirements.</p></div></div>`}
function creatorName(){const d=creatorDraft;return `<div class="creator-intro"><div class="kicker">II — Name</div><h1 class="title">A name on the file</h1><p>Like the Sangris creator, first and last name generators are independent. They use your selected origin first and naming style second; changing origin never overwrites a name you already chose.</p></div><div class="card">${cSelect('c-naming','Naming style',[['masculine','Masculine names'],['feminine','Feminine names'],['neutral','Gender-neutral / flexible names'],['unrestricted','Any appropriate name']],d.namingStyle)}<div class="name-row"><div class="field"><label>First name</label><input id="c-first" value="${esc(d.firstName)}" autocomplete="off"></div><button class="button secondary" id="c-gen-first">Generate first name</button></div><div class="name-row"><div class="field"><label>Last name</label><input id="c-last" value="${esc(d.lastName)}" autocomplete="off"></div><button class="button secondary" id="c-gen-last">Generate last name</button></div><div class="live-desc"><b>${esc(ORIGIN_LABELS[d.country])} name pool</b><p>The generator is period-oriented rather than modern-fantasy styled. These remain the only free-typing fields in this creator.</p></div></div>`}
function creatorOccupation(){const d=creatorDraft,o=OCCUPATION_DEFS[d.occupation];return `<div class="creator-intro"><div class="kicker">III — Occupation</div><h1 class="title">The life you can explain</h1><p>The campaign supplies occupations tied to Aware Archetypes. Your occupation is also one of the main ways the game understands practical expertise.</p></div><div class="card">${cSelect('c-occupation','Occupation',Object.entries(OCCUPATION_DEFS).map(([k,v])=>[k,v.name+' — '+v.archetype]),d.occupation)}<div class="live-desc"><b>${esc(o.name)} · ${esc(o.archetype)}</b><p>${esc(o.desc)}</p><p class="small muted">Languages: ${esc(o.languages)}</p></div>${cSelect('c-occ-a1',o.q1,o.a1,d.occupationAnswers[0])}${cSelect('c-occ-a2',o.q2,o.a2,d.occupationAnswers[1])}<div class="rules-note"><b>Skills in KULT</b><p>The rules currently loaded do not use a separate numerical skill list. Player Moves roll against Attributes; occupation, languages, and Advantages describe expertise. Chagidiel will not invent a skill-point system while the full core book is still pending.</p></div></div>`}
function creatorDarkSecret(){const d=creatorDraft,x=DARK_SECRET_DEFS[d.darkSecret];return `<div class="creator-intro"><div class="kicker">IV — Dark Secret</div><h1 class="title">What follows you</h1><p>The Black Madonna requires one campaign Dark Secret. The follow-up questions turn it into usable character history rather than a decorative tag.</p></div><div class="card">${cSelect('c-secret','Dark Secret',Object.entries(DARK_SECRET_DEFS).map(([k,v])=>[k,v.name]),d.darkSecret)}<div class="live-desc"><b>${esc(x.name)}</b><p>${esc(x.desc)}</p></div>${cSelect('c-secret-a1',x.q1,x.a1,d.darkSecretAnswers[0])}${cSelect('c-secret-a2',x.q2,x.a2,d.darkSecretAnswers[1])}</div>`}
function creatorFamily(){const d=creatorDraft,x=FAMILY_DEFS[d.family];return `<div class="creator-intro"><div class="kicker">V — Family & Relations</div><h1 class="title">Who waits at home</h1><p>The campaign replaces the default family setup with its own Relation packages. This establishes the person or attachment most likely to matter outside the investigation.</p></div><div class="card">${cSelect('c-family','Family situation',Object.entries(FAMILY_DEFS).map(([k,v])=>[k,v.name]),d.family)}<div class="live-desc"><b>${esc(x.name)}</b><p>${esc(x.desc)}</p><p class="small muted">Starting Relation: ${esc(x.relation)}</p></div>${cSelect('c-family-a1',x.q1,x.a1,d.familyAnswers[0])}${cSelect('c-family-a2',x.q2,x.a2,d.familyAnswers[1])}</div>`}
function creatorMagda(){const d=creatorDraft,x=MAGDA_DEFS[d.relation],req=magdaRequirementState(d.relation);return `<div class="creator-intro"><div class="kicker">VI — Magda Orlova</div><h1 class="title">Why she knows you</h1><p>Magda is the campaign’s first personal hinge. The published options have historical requirements, so the creator checks them against the background you already chose.</p></div><div class="card">${cSelect('c-magda','Relationship with Magda',Object.entries(MAGDA_DEFS).map(([k,v])=>[k,v.name]),d.relation)}<div class="live-desc"><b>${esc(x.name)} · ${esc(x.rating)}</b><p>${esc(x.desc)}</p><p class="requirement ${req.ok?'ok':'warn'}">${esc(req.text)}</p></div>${!req.ok?'<div class="rules-note"><b>Requirement warning</b><p>You can go back and adjust age, origin, Germany history, current city, or occupation. Chagidiel will block the final lock only where the requirement can be checked reliably.</p></div>':''}</div>`}
function attrSelect(k,v,allowed){return `<div class="attr creator-attr"><label>${esc(ATTR_LABELS[k])}</label><select data-cattr="${k}">${allowed.map(n=>cOpt(n,(n>=0?'+':'')+n,v)).join('')}</select></div>`}
function attrSpreadStatus(){const d=creatorDraft;const p=PASSIVE_ATTRS.map(k=>Number(d.attributes[k])).sort((a,b)=>b-a).join(','),a=ACTIVE_ATTRS.map(k=>Number(d.attributes[k])).sort((a,b)=>b-a).join(',');return {passive:p==='2,1,0',active:a==='3,2,1,1,0,-1,-2'}}
function creatorAttributes(){const d=creatorDraft,s=attrSpreadStatus();return `<div class="creator-intro"><div class="kicker">VII — Rules & Attributes</div><h1 class="title">What you can do</h1><p>The beta now enforces the published Black Madonna starting spreads instead of allowing arbitrary numbers.</p></div><div class="card"><div class="rules-grid"><div class="rules-note"><b>Core resolution</b><p>Roll 2d10 + the relevant Attribute. 15+ is a complete success; 10–14 succeeds with complications; 9 or less gives the GM room for serious consequences.</p></div><div class="rules-note"><b>No separate skill ratings</b><p>In the rules currently supplied, KULT uses Attributes and Moves rather than a skill-point list. Occupation, languages, Advantages, and fiction establish specialized competence.</p></div><div class="rules-note"><b>Starting Passive Attributes</b><p>Assign exactly <strong>+2, +1, +0</strong> across Fortitude, Reflexes, and Willpower.</p></div><div class="rules-note"><b>Starting Active Attributes</b><p>Assign exactly <strong>+3, +2, +1, +1, +0, −1, −2</strong> across Charisma, Coolness, Intuition, Perception, Reason, Soul, and Violence.</p></div><div class="rules-note"><b>Later caps</b><p>The Quickstart advancement rules normally raise active/passive Attributes to a maximum of +3; specific later advancements can raise an Attribute to +4. Starting creation here never exceeds the campaign spread.</p></div><div class="rules-note"><b>Advantages / Disadvantages</b><p>The campaign calls for 3 Advantages and 2 Disadvantages, but their full Archetype lists are in the core book you plan to add later. The beta reserves those fields rather than inventing options.</p></div></div><div class="divider"></div><div class="kicker">Passive Attributes <span class="spread-state ${s.passive?'ok':'warn'}">${s.passive?'LEGAL':'ADJUST'}</span></div><div class="attr-grid">${PASSIVE_ATTRS.map(k=>attrSelect(k,d.attributes[k],[0,1,2])).join('')}</div><div class="kicker" style="margin-top:18px">Active Attributes <span class="spread-state ${s.active?'ok':'warn'}">${s.active?'LEGAL':'ADJUST'}</span></div><div class="attr-grid">${ACTIVE_ATTRS.map(k=>attrSelect(k,d.attributes[k],[-2,-1,0,1,2,3])).join('')}</div><button class="button secondary" id="c-reset-attrs" style="margin-top:12px">Restore legal default spread</button></div>`}
function creatorReview(){const d=creatorDraft,o=OCCUPATION_DEFS[d.occupation],sec=DARK_SECRET_DEFS[d.darkSecret],fam=FAMILY_DEFS[d.family],mag=MAGDA_DEFS[d.relation],req=magdaRequirementState(d.relation),s=attrSpreadStatus();return `<div class="creator-intro"><div class="kicker">VIII — Review</div><h1 class="title">${esc((d.firstName+' '+d.lastName).trim()||'Unnamed')}</h1><p>This is the background the campaign will actually save. Private material such as the Dark Secret remains on your character layer unless you choose to disclose it later.</p></div><div class="card review-card"><h3>Origin</h3><p>${esc(d.region)}, ${esc(ORIGIN_LABELS[d.country])}. ${esc(GERMANY_HISTORY[d.germanyHistory])}; now based in ${esc(d.currentBase)}. ${esc(GERMANY_REASON[d.germanyReason])}. Age ${esc(d.ageBand)}. ${esc(PRESENTATIONS[d.presentation])} presentation.</p><h3>Occupation</h3><p><b>${esc(o.name)}</b> — ${esc(o.archetype)}. ${esc(o.languages)}</p><p class="small muted">${esc(o.q1)} ${esc(d.occupationAnswers[0])}<br>${esc(o.q2)} ${esc(d.occupationAnswers[1])}</p><h3>Dark Secret</h3><p><b>${esc(sec.name)}</b>. ${esc(sec.desc)}</p><p class="small muted">${esc(d.darkSecretAnswers.join(' · '))}</p><h3>Family</h3><p><b>${esc(fam.name)}</b> — ${esc(fam.relation)}.</p><p class="small muted">${esc(d.familyAnswers.join(' · '))}</p><h3>Magda Orlova</h3><p><b>${esc(mag.name)}</b> — ${esc(mag.rating)}.</p><p class="requirement ${req.ok?'ok':'warn'}">${esc(req.text)}</p><h3>Rules check</h3><p>${s.passive&&s.active?'Attribute allocation is legal for a Black Madonna starting character.':'Attribute allocation is not legal yet. Return to Attributes.'}</p><p class="small muted">Advantages: reserved for core-book integration (3 required). Disadvantages: reserved for core-book integration (2 required).</p></div>`}

function renderStoryLock(){const s=API.state,st=s.story,last=s.storyLock.lastResolution;const img=st.art?`<figure class="scene-media ${s.current.scene==='pogodin'?'right':'left'}"><img class="art" src="${st.art}" alt=""></figure>`:'';$('#main').innerHTML=`<div class="screen"><div class="lock-banner"><img src="/media/ui/motifs/kult_winged_emblem_red.png"><div><b>Story Lock Active</b><span>No solo progression until this scenario ends.</span></div></div><div class="kicker">${esc(st.kicker)}</div><h1 class="title">${esc(st.title)}</h1><div class="copy story-clear">${img}${st.text.map(p=>`<p>${esc(p)}</p>`).join('')}${last?`<div class="result-card"><h3>Previous beat</h3>${last.text.map(p=>`<p>${esc(p)}</p>`).join('')}<div class="small muted">${['A','B'].map(x=>last.actions?.[x]?.roll?`${x}: ${rollText(last.actions[x].roll)}`:'').filter(Boolean).join('<br>')}</div></div>`:''}</div>${s.storyLock.submitted?`<div class="card red"><div class="kicker">Action locked</div><p class="muted">Waiting for the other protagonist. Your selection remains sealed until both are in.</p></div>`:`<div class="choices">${(s.choices||[]).map((c,i)=>`<button class="button choice" data-action="${esc(c.id)}" data-n="${['I','II','III','IV','V','VI'][i]||i+1}"><b>${esc(c.label)}</b>${c.move?`<span class="move">${esc(MOVE_LABEL[c.move]||c.move)}</span>`:''}</button>`).join('')}</div>`}</div>`;$$('[data-action]').forEach(b=>b.onclick=()=>act({type:'lock_action',actionId:b.dataset.action},'Resolving action',tensionLines[Math.floor(Math.random()*tensionLines.length)]));scheduleReadAloud()}
function renderFreeRoam(){const s=API.state,fr=s.freeRoam,last=fr.lastResult;$('#main').innerHTML=`<div class="screen"><div class="roam-header"><div><div class="kicker">Free Roam - ${esc(fr.day)}</div><h1 class="title" style="font-size:2.35rem;margin-bottom:3px">Berlin</h1></div><div><div class="small muted" style="text-align:right;margin-bottom:5px">Your time</div><div class="time-slots">${fr.slots.map(x=>`<i class="slot ${x?'used':''}"></i>`).join('')}</div></div></div>${campaignEntryNote()}<div class="copy"><p>You may investigate independently. The other protagonist's time is their own. Discoveries enter your private notes first; sharing them makes them character knowledge for both protagonists.</p></div>${last&&last.kind!=='roll'?`<div class="result-card"><h3>${esc(last.locationName)}</h3><p>${esc(last.prose)}</p>${last.characterEcho?`<p><em>${esc(last.characterEcho)}</em></p>`:''}${last.roll?`<div class="roll-inline ${last.roll.outcome}">${rollText(last.roll)}</div>`:''}<div style="margin-top:8px"><button class="button secondary" id="shareLatest">Add discovery to shared case file</button></div></div>`:''}<div class="location-grid">${Object.entries(fr.locations).map(([id,l])=>`<div class="card location"><h3>${esc(l.name)}</h3><div class="action-list">${Object.entries(l.actions).map(([aid,a])=>`<button class="button" data-loc="${id}" data-roam="${aid}"><b>${esc(a.label)}</b>${a.move?`<span>${esc(MOVE_LABEL[a.move]||a.move)}</span>`:''}</button>`).join('')}</div></div>`).join('')}</div></div>`;bindCampaignEntryNote();$$('[data-roam]').forEach(b=>b.onclick=()=>act({type:'free_roam_action',location:b.dataset.loc,actionId:b.dataset.roam},'Resolving Free Roam','The city continues while you decide what to notice.'));if($('#shareLatest'))$('#shareLatest').onclick=()=>{const privateClues=s.journal.private;const newest=privateClues[privateClues.length-1];if(newest)act({type:'share_clue',clueId:newest.clueId,source:last?.locationName||''},'Sharing evidence','What was private becomes part of the case you are building together.')};scheduleReadAloud()}
function renderBetaComplete(){const s=API.state;$('#main').innerHTML=`<div class="screen"><div class="hero"><img src="/media/art/scenes/ch01_pogodin_ritual_collage.webp"><div class="hero-brand"><img class="hero-symbol" src="/media/ui/motifs/kult_winged_emblem_red.png"><h1>Marked</h1><p>Chapter I beta boundary</p></div></div><div class="kicker">The Killers' Dance</div><h1 class="title">The story has changed you</h1><div class="copy"><p>The three Russians are gone. Whatever you believed the ritual would do, it did something else.</p><p>${s.flags.marked?.self?'You were one of the people who completed the rite. The touch it left on you is not a metaphor.':'Your partner crossed the final line of the rite. You witnessed what followed, but the mark itself was not placed on you.'}</p><p>This beta ends at the handoff into Chapter II. The multiplayer state, Story Lock flow, Free Roam, private/shared evidence, KULT Player Moves 2.0 rolls, presence, login, notifications, narration, and Chapter I vertical slice are active.</p></div></div>`;scheduleReadAloud()}

async function showCampaignInviteManager(){nav='invite';hideModal();renderApp()}
async function shareCampaignInvite(){const s=API.state,code=s?.invite?.code;if(!s||!code)return;const url=inviteLink(s.id,code),text=`Join my Chagidiel campaign. Campaign ID: ${s.id}. Invite code: ${code}.`;if(navigator.share){try{await navigator.share({title:'Chagidiel campaign invitation',text,url});return}catch(e){if(e?.name==='AbortError')return}}await copyText(`${text} ${url}`,'Campaign invite')}
async function regenerateCampaignInvite(){showResolve('Creating invite','The previous key will no longer open this door.');try{const d=await request(`/api/campaigns/${API.campaign}/invite`,{method:'POST'});if(!API.state.invite)API.state.invite={};API.state.invite={canManage:true,claimed:!!d.claimed,code:d.invite||null};hideResolve();renderInvitePanel();toast('Campaign invite','A new one-use invite code is ready.')}catch(e){hideResolve();toast('Campaign invite',e.message)}}
function renderPanel(){const s=API.state;if(nav==='invite'){renderInvitePanel();return}if(nav==='case'){const items=journalTab==='shared'?s.journal.shared:s.journal.private;$('#main').innerHTML=`<div class="screen"><div class="kicker">Investigation</div><h1 class="title">Case File</h1><div class="journal-tabs"><button class="tab ${journalTab==='shared'?'active':''}" data-tab="shared">Shared Case File</button><button class="tab ${journalTab==='private'?'active':''}" data-tab="private">Personal Notes</button></div><div class="card">${items.length?items.map(x=>`<div class="evidence"><b>${esc(x.clue?.title||x.clueId)}</b><p>${esc(x.clue?.text||'')}</p>${journalTab==='private'&&!s.journal.shared.some(y=>y.clueId===x.clueId)?`<button class="button secondary" data-share="${esc(x.clueId)}">Tell partner / add to case file</button>`:''}</div>`).join(''):'<p class="muted">Nothing has been recorded here yet.</p>'}</div></div>`;$$('[data-tab]').forEach(b=>b.onclick=()=>{journalTab=b.dataset.tab;renderPanel()});$$('[data-share]').forEach(b=>b.onclick=()=>act({type:'share_clue',clueId:b.dataset.share},'Sharing evidence'));return}if(nav==='character'){renderCharacterPanel();return}if(nav==='relations'){const partner=s.partner?.character?.name||'Other protagonist';$('#main').innerHTML=`<div class="screen"><div class="kicker">Relations</div><h1 class="title">People who matter</h1><div class="card"><h3 style="font-weight:400;margin-top:0">${esc(partner)}</h3><p class="muted">The beta records shared decisions and returns-to-partner behavior in the event history, but the full KULT Relations advancement layer will be expanded when the core rulebook is added.</p></div><div class="card"><h3 style="font-weight:400;margin-top:0">Magda Orlova</h3><p class="muted">Your campaign-linked relationship was chosen during character creation and is used as story context.</p></div></div>`;return}if(nav==='settings'){const read=localStorage.getItem('chagidielReadAloud')==='on';$('#main').innerHTML=`<div class="screen"><div class="kicker">System</div><h1 class="title">Settings</h1><div class="card"><h3 style="font-weight:400">Narration</h3><p class="muted">Read Aloud is ${read?'On':'Off'}. It reads rendered story text after the page settles and excludes unchosen controls.</p><button class="button secondary" id="voiceBtn">Narration / ElevenLabs</button></div><div class="card"><h3 style="font-weight:400">Notifications</h3><p class="muted">Browser permission: ${'Notification'in window?Notification.permission:'unsupported'}. Remote beta alerts can use the account email when outbound email is configured.</p><button class="button secondary" id="notifBtn">Request browser permission</button></div><div class="card"><h3 style="font-weight:400">Campaign Invitation</h3><p class="muted">${s.seat==='A'?(s.partner?'Seat B has claimed the campaign.':'Create, copy, share, or regenerate the one-use Seat B invitation.'):'Seat A controls the campaign invitation.'}</p><button class="button secondary" id="inviteSettingsBtn">Open invitation section</button></div>${API.user?.role==='admin'?`<div class="card"><h3 style="font-weight:400">Administrator</h3><p class="muted">Create and resend password-reset links for player accounts.</p><button class="button secondary" id="adminBtn">Account administration</button></div>`:''}<div class="card"><h3 style="font-weight:400">Account & Campaign</h3><p class="muted">${esc(API.user?.email||'')}<br>${esc(API.campaign)}</p><p class="save-state ok">Progressive save: every submitted choice, conversation decision, roll, case-file share, character change, and browser load is stored server-side. Last save: ${s.savedAt?new Date(s.savedAt).toLocaleString():'available on server'}.</p><button class="button secondary" id="leaveBtn">Sign out on this device</button></div></div>`;$('#notifBtn').onclick=promptNotifications;$('#leaveBtn').onclick=signOut;$('#inviteSettingsBtn').onclick=()=>{nav='invite';renderApp()};if($('#adminBtn'))$('#adminBtn').onclick=showAdminAccounts;$('#voiceBtn').onclick=voiceModal;return}}
async function showAdminAccounts(){
  showModal(`<img class="modal-symbol" src="/media/ui/motifs/kult_winged_emblem_red.png"><h2>Account administration</h2><p>Loading accounts...</p>`);
  try{
    const d=await request('/api/admin/users');
    const rows=(d.users||[]).map(u=>`<div class="card" style="margin-top:8px"><div class="kicker">${u.role==='admin'?'Administrator':'Player account'}</div><p style="margin:0 0 5px"><b>${esc(u.email)}</b></p><p class="small muted" style="margin:0">Last login: ${u.lastLoginAt?new Date(u.lastLoginAt).toLocaleString():'Never'}</p><button class="button secondary" data-admin-reset="${esc(u.uid)}" style="margin-top:9px">Send / regenerate password reset</button></div>`).join('');
    showModal(`<img class="modal-symbol" src="/media/ui/motifs/kult_winged_emblem_red.png"><h2>Account administration</h2><p>${d.emailResetDeliveryConfigured?'Reset links can be emailed automatically.':'Outbound reset email is not configured. Reset links can still be generated and copied manually.'}</p>${rows||'<p class="muted">No accounts found.</p>'}<div class="modal-actions"><button class="button secondary" id="closeAdmin">Close</button></div>`);
    $('#closeAdmin').onclick=hideModal;$$('[data-admin-reset]').forEach(b=>b.onclick=()=>issueAdminReset(b.dataset.adminReset));
  }catch(e){showModal(`<h2>Account administration</h2><p>${esc(e.message)}</p><div class="modal-actions"><button class="button secondary" id="closeAdmin">Close</button></div>`);$('#closeAdmin').onclick=hideModal}
}
async function issueAdminReset(uid){
  try{
    const d=await request('/api/admin/reset',{method:'POST',body:JSON.stringify({uid})});
    const delivery=d.emailed?'A reset email was sent.':'No email was sent; use the link below and send it to the player yourself.';
    showModal(`<img class="modal-symbol" src="/media/ui/motifs/kult_winged_emblem_bone.png"><h2>Password reset issued</h2><p>${esc(delivery)}</p><div class="field"><label>One-time reset link</label><input id="adminResetLink" readonly value="${esc(d.resetUrl)}"></div>${d.emailError?`<p class="small muted">Email status: ${esc(d.emailError)}</p>`:''}<p class="small muted">This link expires in 60 minutes. Generating another reset for this account invalidates the previous link.</p><div class="modal-actions"><button class="button primary" id="copyResetLink">Copy reset link</button><button class="button secondary" id="backAdmin">Back to accounts</button></div>`);
    $('#copyResetLink').onclick=async()=>{const el=$('#adminResetLink');try{await navigator.clipboard.writeText(el.value);toast('Administrator','Reset link copied.')}catch(e){el.select();document.execCommand('copy');toast('Administrator','Reset link copied.')}};$('#backAdmin').onclick=showAdminAccounts;
  }catch(e){toast('Administrator',e.message)}
}
async function voiceModal(){
  let voices=[];try{voices=(await request('/api/voices')).voices||[]}catch(e){}
  const selected=localStorage.getItem('chagidielVoice')||'54YYBuRuAG6KJooiOhFI',rate=Number(localStorage.getItem('chagidielNarrationRate')||0.90),volume=Number(localStorage.getItem('chagidielNarrationVolume')||0.85),read=localStorage.getItem('chagidielReadAloud')==='on';
  showModal(`<img class="modal-symbol" src="/media/ui/motifs/kult_winged_emblem_bone.png"><h2>Narration / ElevenLabs</h2><p>Chagidiel uses the same featured narrator set and account voice library as Sangris. Read Aloud waits for the visible page to settle, reads the rendered story, and stops at choices.</p><div class="narration-grid"><div class="narration-field"><label>Read Aloud</label><select id="readMode"><option value="off" ${read?'':'selected'}>Off</option><option value="on" ${read?'selected':''}>On</option></select></div><div class="narration-row"><div class="narration-field"><label>Voice</label><select id="voiceSelect">${voices.map(v=>`<option value="${esc(v.voice_id)}" ${v.voice_id===selected?'selected':''}>${esc(v.name)}</option>`).join('')}</select></div><button class="button secondary" id="previewVoice">Preview</button></div><div class="narration-field"><label>Playback rate <span class="narration-value" id="rateReadout">${rate.toFixed(2)}×</span></label><input id="narrationRate" type="range" min="0.65" max="1.25" value="${rate}" step="0.05"></div><div class="narration-field"><label>Narration volume <span class="narration-value" id="volumeReadout">${Math.round(volume*100)}%</span></label><input id="narrationVolume" type="range" min="0" max="1" value="${volume}" step="0.05"></div><div class="narration-actions"><button class="button primary" id="readPageNow">Read Page</button><button class="button secondary" id="stopNarration">Stop</button></div></div><div class="modal-actions"><button class="button primary" id="saveVoice">Save settings</button><button class="button secondary" id="closeVoice">Close</button></div>`);
  const rateEl=$('#narrationRate'),volEl=$('#narrationVolume');rateEl.oninput=()=>$('#rateReadout').textContent=Number(rateEl.value).toFixed(2)+'×';volEl.oninput=()=>$('#volumeReadout').textContent=Math.round(Number(volEl.value)*100)+'%';
  $('#previewVoice').onclick=async()=>{const old=localStorage.getItem('chagidielVoice');localStorage.setItem('chagidielVoice',$('#voiceSelect').value);await playNarrationText('Berlin keeps its secrets badly. The trouble is knowing which ones are trying to be found.','voice_preview',true);if(old)localStorage.setItem('chagidielVoice',old);else localStorage.removeItem('chagidielVoice')};
  $('#readPageNow').onclick=()=>{saveNarrationSettingsFromModal();hideModal();scheduleReadAloud(true)};$('#stopNarration').onclick=stopNarration;$('#saveVoice').onclick=()=>{saveNarrationSettingsFromModal();hideModal();toast('Narration','Narration settings saved.')};$('#closeVoice').onclick=hideModal
}
function saveNarrationSettingsFromModal(){if($('#voiceSelect'))localStorage.setItem('chagidielVoice',$('#voiceSelect').value);if($('#narrationRate'))localStorage.setItem('chagidielNarrationRate',$('#narrationRate').value);if($('#narrationVolume'))localStorage.setItem('chagidielNarrationVolume',$('#narrationVolume').value);if($('#readMode'))localStorage.setItem('chagidielReadAloud',$('#readMode').value);readSwitchSync();if(localStorage.getItem('chagidielReadAloud')==='on')requestWakeLock();else releaseWakeLock()}
$$('.nav button').forEach(b=>b.onclick=()=>{nav=b.dataset.nav;renderApp()});
async function unlockAudio(){if(audioUnlocked)return;const a=$('#narration');try{const bytes=Uint8Array.from(atob('UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA='),c=>c.charCodeAt(0));const blob=new Blob([bytes],{type:'audio/wav'});a.src=URL.createObjectURL(blob);a.volume=.001;await a.play();a.pause();a.currentTime=0;audioUnlocked=true}catch(e){}}
async function requestWakeLock(){try{if('wakeLock'in navigator&&!wakeLock)wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}
async function releaseWakeLock(){try{if(wakeLock)await wakeLock.release()}catch(e){}wakeLock=null}
function stopNarration(){const a=$('#narration');try{a.pause();a.removeAttribute('src');a.load()}catch(e){}readBusy=false}
$('#readSwitch').onclick=async()=>{const on=localStorage.getItem('chagidielReadAloud')==='on';localStorage.setItem('chagidielReadAloud',on?'off':'on');readSwitchSync();if(!on){await unlockAudio();await requestWakeLock();scheduleReadAloud(true)}else{stopNarration();releaseWakeLock()}}
function readSwitchSync(){const on=localStorage.getItem('chagidielReadAloud')==='on';$('#readSwitch').classList.toggle('on',on);$('#readSwitch').setAttribute('aria-checked',String(on))}
function collectNarration(){const root=$('#main');if(!root)return'';const clone=root.cloneNode(true);clone.querySelectorAll('button,input,select,.choices,.ready-grid,.lock-banner,.roll-inline,.save-state,.no-narrate').forEach(x=>x.remove());return clone.innerText.replace(/\n{3,}/g,'\n\n').trim()}
async function settledNarrationText(){let last='',stable=0;for(let i=0;i<12;i++){const text=collectNarration();if(text&&text===last)stable++;else stable=0;last=text;if(stable>=2)return text;await new Promise(r=>setTimeout(r,120))}return last}
function chunks(text,max=3000){const paras=text.split(/\n\n+/);const out=[];let cur='';for(const p of paras){if((cur+'\n\n'+p).length>max&&cur){out.push(cur);cur=p}else cur+=(cur?'\n\n':'')+p}if(cur)out.push(cur);return out}
async function narrationFetch(scene,voice,text){let lastError=null;for(let attempt=0;attempt<3;attempt++){try{const r=await fetch('/api/narration-page',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+API.token},cache:'no-store',body:JSON.stringify({scene,voice,text})});if(r.ok)return r;if(![408,425,429,500,502,503,504].includes(r.status))throw new Error('Narration unavailable');lastError=new Error('Narration temporarily unavailable')}catch(e){lastError=e}if(attempt<2)await new Promise(r=>setTimeout(r,500*Math.pow(2,attempt)))}throw lastError||new Error('Narration unavailable')}
async function playNarrationText(text,scenePrefix='page',force=false){if(!text||readBusy)return;readBusy=true;try{await unlockAudio();await requestWakeLock();const voice=localStorage.getItem('chagidielVoice')||'54YYBuRuAG6KJooiOhFI',rate=Number(localStorage.getItem('chagidielNarrationRate')||0.90),volume=Number(localStorage.getItem('chagidielNarrationVolume')||0.85);let n=0;for(const part of chunks(text)){const r=await narrationFetch(`${scenePrefix}_${n++}`,voice,part),blob=await r.blob(),u=URL.createObjectURL(blob),a=$('#narration');a.src=u;a.playbackRate=rate;a.volume=Math.max(0,Math.min(1,volume));await a.play();await new Promise((res,rej)=>{a.onended=res;a.onerror=rej});URL.revokeObjectURL(u)}}catch(e){toast('Read Aloud','Narration could not play. Check the ElevenLabs Worker configuration.')}finally{readBusy=false;if(localStorage.getItem('chagidielReadAloud')!=='on')releaseWakeLock()}}
async function scheduleReadAloud(force=false){readSwitchSync();if(localStorage.getItem('chagidielReadAloud')!=='on'||readBusy)return;const text=await settledNarrationText();if(!text)return;const key=`${API.state?.revision||0}:${API.state?.current?.scene||nav}:${API.state?.current?.beat||0}:${nav}`;if(!force&&key===lastNarratedKey)return;lastNarratedKey=key;await playNarrationText(text,API.state?.current?.scene||nav,force)}
async function notifyLocal(title,body){try{if('serviceWorker'in navigator){const r=await navigator.serviceWorker.ready;r.showNotification(title,{body,icon:'/media/ui/motifs/kult_winged_emblem_red.png',badge:'/media/ui/motifs/kult_winged_emblem_red.png'})}}catch(e){}}
document.addEventListener('pointerdown',()=>{if(localStorage.getItem('chagidielReadAloud')==='on')unlockAudio()},{once:true});
async function boot(){
  const resetToken=new URLSearchParams(location.search).get('reset');
  if(resetToken){renderResetPassword(resetToken);return}
  const incomingInvite=captureInviteFromUrl();
  if(API.token){
    try{const d=await request('/api/auth/me');API.user=d.user}catch(e){localStorage.removeItem('chagidielToken');localStorage.removeItem('chagidielCampaign');API.token='';API.campaign='';API.state=null;API.user=null}
  }
  if(API.token&&incomingInvite){API.campaign='';renderHub()}else if(API.token&&API.campaign)loadState();else if(API.token)resumeAccount();else route();
}
readSwitchSync();boot();
</script>
